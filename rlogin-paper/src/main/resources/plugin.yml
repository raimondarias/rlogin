name: rLogin
main: com.raimondarias.rlogin.paper.RLoginPaperPlugin
version: '${version}'
api-version: '1.21'
author: raimondarias
description: Autenticación premium automática + login para no-premium (Paper, Velocity, Folia)
website: https://github.com/raimondarias/rlogin
folia-supported: true

commands:
  login:
    description: Inicia sesión con tu contraseña
    aliases: [l]
    usage: /login <contraseña> [código-2fa]
  register:
    description: Registra tu cuenta
    aliases: [reg]
    usage: /register <contraseña> <repite la contraseña>
  changepassword:
    description: Cambia tu contraseña
    aliases: [changepass]
    usage: /changepassword <contraseña actual> <contraseña nueva>
  logout:
    description: Cierra tu sesión
  2fa:
    description: Gestiona la verificación en dos pasos (TOTP)
    usage: /2fa <enable|disable|confirm> [código]
  premium:
    description: Consulta el estado premium de tu cuenta
  rlogin:
    description: Comando general de rLogin (incluye todos los anteriores + administración)
    aliases: [rl]

permissions:
  rlogin.admin:
    description: Acceso a los comandos de administración de rLogin
    default: op
  rlogin.bypass:
    description: Omite el requisito de login (NPCs, bots de pruebas, etc.)
    default: false
