name: rLogin
main: com.raimondarias.rlogin.paper.RLoginPaperPlugin
version: '${version}'
api-version: '1.21'
author: raimondarias
description: Automatic premium auto-login + password login for cracked accounts (Paper, Velocity, Folia)
website: https://github.com/pyrelightmc/rlogin
folia-supported: true
softdepend: [packetevents, LuckPerms]

commands:
  login:
    description: Log in with your password
    aliases: [l]
    usage: /login <password> [2fa-code]
  register:
    description: Register your account
    aliases: [reg]
    usage: /register <password> <repeat password>
  changepassword:
    description: Change your password
    aliases: [changepass]
    usage: /changepassword <current password> <new password>
  logout:
    description: Log out
  2fa:
    description: Manage two-factor authentication (TOTP)
    usage: /2fa <enable|disable|confirm> [code]
  premium:
    description: Check your account's premium status
  recover:
    description: Recover your account with a one-time code
    usage: /recover <code> <new password>
  rlogin:
    description: General rLogin command (includes all of the above plus administration)
    aliases: [rl]

permissions:
  rlogin.admin:
    description: Access to rLogin's admin commands
    default: op
  rlogin.bypass:
    description: Skips the login requirement (NPCs, test bots, etc.)
    default: false
