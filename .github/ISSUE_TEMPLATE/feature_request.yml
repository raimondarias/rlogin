name: Feature request
description: Something rLogin should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. Knowing the problem often turns up a better answer than the feature that prompted it.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How are you handling it today?
