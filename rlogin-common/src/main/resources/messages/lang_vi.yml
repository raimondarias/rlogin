# Tin nhắn rLogin — Tiếng Việt
# Placeholder khả dụng tùy theo tin nhắn: {player} {seconds} {attempts} {min}
#
# Định dạng màu — có thể kết hợp tự do:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Mã cổ điển: &a / §a (và &l, &n... cho kiểu chữ, &r để đặt lại)
#   3. Hex (kiểu BungeeCord/Spigot, mặc định trong tệp này):
#      &#RRGGBB, §x§R§R§G§G§B§B, hoặc #RRGGBB đơn lẻ

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

