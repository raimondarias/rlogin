  premium-only: "&#fd5e5e&lهذا الخادم يقبل الحسابات الأصلية فقط.\n\n&#d4d9d8اشترِ Minecraft من minecraft.net، أو اطلب من المالك السماح بالحسابات غير الأصلية."

