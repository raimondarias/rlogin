  usage: "{prefix}&#fd5e5eالاستخدام: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eلحظة غير معروفة: &#fd8ddb{role}&#fd5e5e. استخدم إحدى: &#fd8ddb{roles}"
  set: "{prefix}&#91f251تم حفظ نقطة ظهور &#fd8ddb{role}&#91f251 حيث تقف: &#fd8ddb{location}"
  removed: "{prefix}&#91f251تم حذف نقطة ظهور &#fd8ddb{role}&#91f251. يبقى اللاعبون الآن حيث خرجوا."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e لم تكن لها نقطة ظهور."
  teleported: "{prefix}&#91f251تم النقل إلى نقطة ظهور &#fd8ddb{role}&#91f251: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e ليس لها نقطة ظهور."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e تشير إلى العالم &#fd8ddb{world}&#fd5e5e غير المحمّل. سيبقى اللاعبون مكانهم."