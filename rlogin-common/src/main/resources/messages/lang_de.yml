# rLogin Nachrichten — Deutsch
# Verfügbare Platzhalter je nach Nachricht: {player} {seconds} {attempts} {min}
#
# Farbformate — beliebig kombinierbar:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Klassische Codes: &a / §a (und &l, &n... für Stile, &r zum Zurücksetzen)
#   3. Hex (BungeeCord/Spigot-Stil, hier standardmäßig verwendet):
#      &#RRGGBB, §x§R§R§G§G§B§B, oder ein einzelnes #RRGGBB

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eNur ein Spieler kann diesen Befehl verwenden."

login:
  usage: "{prefix}&#fd5e5eVerwendung: &#e39fff/login <Passwort>"
  wrong-password: "{prefix}&#fd5e5eFalsches Passwort. Verbleibende Versuche: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eDu bist bereits angemeldet."
  success: "{prefix}&#91f251Erfolgreich angemeldet. Willkommen &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5eGib auch deinen 2FA-Code ein: &#e39fff/login <Passwort> <Code>"
  wrong-totp: "{prefix}&#fd5e5eFalscher 2FA-Code."
  not-registered: "{prefix}&#fd5e5eDu hast noch kein Konto. Registriere dich mit &#e39fff/register <Passwort> <Passwort>"
  session-restored: "{prefix}&#91f251Willkommen zurück, {player}. Deine Sitzung war noch aktiv."

register:
  usage: "{prefix}&#fd5e5eVerwendung: &#e39fff/register <Passwort> <Passwort wiederholen>"
  already-registered: "{prefix}&#fd5e5eDieses Konto ist bereits registriert."
  passwords-dont-match: "{prefix}&#fd5e5eDie Passwörter stimmen nicht überein."
  password-too-short: "{prefix}&#fd5e5eDas Passwort muss mindestens &#fd8ddb{min}&#fd5e5e Zeichen lang sein."
  premium-name-protected: "{prefix}&#fd5e5eDieser Name gehört zu einem Premium-Konto. Falls er dir gehört, verbinde dich mit dem originalen Minecraft-Client."
  success: "{prefix}&#91f251Registrierung abgeschlossen. Willkommen &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251Abgemeldet."
  not-logged-in: "{prefix}&#fd5e5eDu bist nicht angemeldet."

changepassword:
  usage: "{prefix}&#fd5e5eVerwendung: &#e39fff/changepassword <aktuelles Passwort> <neues Passwort>"
  success: "{prefix}&#91f251Passwort erfolgreich aktualisiert."
  wrong-password: "{prefix}&#fd5e5eDas aktuelle Passwort ist falsch."

premium:
  auto-login-message: "{prefix}&#91f251Premium-Konto erkannt, Sitzung automatisch gestartet."
  info-premium: "{prefix}&#91f251Dein Konto ist von Mojang als Premium verifiziert."
  info-cracked: "{prefix}&#fdba5eDein Konto ist nicht premium, du brauchst ein eigenes Passwort."

limbo:
  freeze-reminder: "{prefix}&#fdba5eDu musst dich anmelden, um dich bewegen zu können. Benutze &#e39fff/login&#fdba5e oder &#e39fff/register&#fdba5e."
  action-blocked: "{prefix}&#fd5e5eDas kannst du erst tun, wenn du angemeldet bist."

security:
  locked-out: "{prefix}&#fd5e5eZu viele fehlgeschlagene Versuche. Warte &#5e9dfd{seconds} Sekunden&#fd5e5e."

totp:
  enabled: "{prefix}&#91f251Zwei-Faktor-Authentifizierung aktiviert."
  disabled: "{prefix}&#91f251Zwei-Faktor-Authentifizierung deaktiviert."
  setup-secret: "{prefix}&#fdba5eDein 2FA-Schlüssel: &#fd8ddb{secret} &#fdba5e(füge ihn deiner Authenticator-App hinzu und bestätige mit &#e39fff/2fa confirm <Code>&#fdba5e)"
  usage: "{prefix}&#fd5e5eVerwendung: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eDie Zwei-Faktor-Authentifizierung ist auf diesem Server deaktiviert."
  confirm-usage: "{prefix}&#fd5e5eVerwendung: &#e39fff/2fa confirm <Code>"
  already-enabled: "{prefix}&#fd5e5eDu hast die Zwei-Faktor-Authentifizierung bereits aktiviert."
  not-enabled: "{prefix}&#fd5e5eDu hast die Zwei-Faktor-Authentifizierung nicht aktiviert."

admin:
  no-permission: "{prefix}&#fd5e5eDu hast keine Berechtigung dafür."
  reloaded: "{prefix}&#91f251Konfiguration neu geladen."
  unregistered: "{prefix}&#91f251Das Konto von &#fd8ddb{player} &#91f251wurde gelöscht."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251wurde zwangsangemeldet."
  player-not-found: "{prefix}&#fd5e5eSpieler nicht gefunden."
  migration-started: "{prefix}&#fdba5eImportiere Konten von &#fd8ddb{plugin}&#fdba5e..."
  migration-done: "{prefix}&#91f251Import abgeschlossen: &#fd8ddb{count} &#91f251Konten importiert."
  migration-failed: "{prefix}&#fd5e5eImportfehler: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> Premium: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, letzter Login: &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8Befehle: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5eUnbekannter Unterbefehl: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5eVerwendung: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5eVerwendung: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5eVerwendung: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5eVerwendung: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5eUnbekannter Importer: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5eÄndere &#fd8ddbgeneral.language&#fdba5e in der config.yml und führe &#e39fff/rlogin reload&#fdba5e aus."
  changeuuid-usage: "{prefix}&#fd5e5eVerwendung: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5eVerschiebt nur Passwort, 2FA und Registrierungsdatum. Inventar, Rechte und Wirtschaft bleiben zurück - die gehören der Welt und anderen Plugins."
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251Konto verschoben. Falls der Spieler online ist, muss er neu verbinden."
  changeuuid-not-found: "{prefix}&#fd5e5eKein rLogin-Konto für &#fd8ddb{input}&#fd5e5e gefunden."
  changeuuid-target-exists: "{prefix}&#fd5e5eDas Ziel hat bereits ein rLogin-Konto. Lösche es zuerst mit &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5eQuelle und Ziel sind dieselbe UUID; nichts zu tun."
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid fehlgeschlagen: &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lServer falsch konfiguriert\n\n&#d4d9d8Diesem Server fehlt ein benötigtes Plugin, deshalb kann niemand beitreten.\n&#fdba5eSag einem Administrator, er soll PacketEvents installieren:\n&#e39fff{link}"


spawn:
  header: "{prefix}&#d4d9d8rLogin-Spawns:"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "nicht gesetzt (Spieler bleiben, wo sie sich ausgeloggt haben)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = bereits authentifizierter Beitritt  &#fdba5efirstjoin&#d4d9d8 = allererster Beitritt  &#fdba5elogin&#d4d9d8 = nach /login  &#fdba5eregister&#d4d9d8 = nach /register"
  usage: "{prefix}&#fd5e5eVerwendung: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eUnbekannter Zeitpunkt: &#fd8ddb{role}&#fd5e5e. Nutze einen davon: &#fd8ddb{roles}"
  set: "{prefix}&#91f251Spawn für &#fd8ddb{role}&#91f251 dort gesetzt, wo du stehst: &#fd8ddb{location}"
  removed: "{prefix}&#91f251Spawn für &#fd8ddb{role}&#91f251 entfernt. Spieler bleiben jetzt, wo sie sich ausgeloggt haben."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e hatte keinen Spawn gesetzt."
  teleported: "{prefix}&#91f251Zum &#fd8ddb{role}&#91f251-Spawn teleportiert: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e hat keinen Spawn gesetzt."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e zeigt auf Welt &#fd8ddb{world}&#fd5e5e, die nicht geladen ist. Spieler würden bleiben, wo sie sind."