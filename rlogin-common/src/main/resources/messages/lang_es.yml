# Mensajes de rLogin — Español
# Placeholders disponibles según el mensaje: {player} {seconds} {attempts} {min}
#
# Formatos de color — se pueden mezclar libremente, los tres funcionan en cualquier texto:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Códigos clásicos: &a / §a (y &l, &n... para estilos, &r para reset)
#   3. Hex (estilo BungeeCord/Spigot, el que usa este archivo por defecto):
#      &#RRGGBB, §x§R§R§G§G§B§B, o un #RRGGBB suelto
#
# Paleta que sigue este archivo:
#   comandos   #e39fff   valores/variables #fd8ddb   errores      #fd5e5e
#   éxito      #91f251   advertencias      #fdba5e   tiempo       #5e9dfd
#   neutral    #d4d9d8

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eSolo un jugador puede usar este comando."

login:
  usage: "{prefix}&#fd5e5eUso: &#e39fff/login <contraseña>"
  wrong-password: "{prefix}&#fd5e5eContraseña incorrecta. Intentos restantes: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eYa has iniciado sesión."
  success: "{prefix}&#91f251Has iniciado sesión correctamente. ¡Bienvenido &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5eIntroduce también tu código 2FA: &#e39fff/login <contraseña> <código>"
  wrong-totp: "{prefix}&#fd5e5eCódigo 2FA incorrecto."
  not-registered: "{prefix}&#fd5e5eNo tienes cuenta. Regístrate con &#e39fff/register <contraseña> <contraseña>"
  session-restored: "{prefix}&#91f251Bienvenido de vuelta, {player}. Tu sesión seguía activa."
  premium-only: "&#fd5e5e&lEste servidor solo acepta cuentas premium.\n\n&#d4d9d8Compra Minecraft en minecraft.net, o pídele al dueño que permita cuentas no premium."

register:
  usage: "{prefix}&#fd5e5eUso: &#e39fff/register <contraseña> <repite la contraseña>"
  already-registered: "{prefix}&#fd5e5eEsta cuenta ya está registrada."
  passwords-dont-match: "{prefix}&#fd5e5eLas contraseñas no coinciden."
  password-too-short: "{prefix}&#fd5e5eLa contraseña debe tener al menos &#fd8ddb{min}&#fd5e5e caracteres."
  premium-name-protected: "{prefix}&#fd5e5eEse nombre pertenece a una cuenta premium. Si es tuya, conéctate desde el cliente original de Minecraft."
  too-many-from-ip: "{prefix}&#fd5e5eSe han creado demasiadas cuentas desde tu dirección. Inténtalo en &#fd8ddb{seconds}&#fd5e5es."
  password-too-common: "{prefix}&#fd5e5eEsa contraseña es de las más comunes que hay. Elige otra."
  password-is-name: "{prefix}&#fd5e5eTu contraseña no puede ser tu propio nombre."
  success: "{prefix}&#91f251Registro completado. ¡Bienvenido &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251Sesión cerrada."
  not-logged-in: "{prefix}&#fd5e5eNo has iniciado sesión."

changepassword:
  usage: "{prefix}&#fd5e5eUso: &#e39fff/changepassword <contraseña actual> <contraseña nueva>"
  success: "{prefix}&#91f251Contraseña actualizada correctamente."
  wrong-password: "{prefix}&#fd5e5eLa contraseña actual no es correcta."

premium:
  auto-login-message: "{prefix}&#91f251Cuenta premium detectada, sesión iniciada automáticamente."
  info-premium: "{prefix}&#91f251Tu cuenta está verificada como premium por Mojang."
  info-cracked: "{prefix}&#fdba5eTu cuenta es no-premium, necesitas contraseña propia."

limbo:
  freeze-reminder: "{prefix}&#fdba5eDebes iniciar sesión para poder moverte. Usa &#e39fff/login&#fdba5e o &#e39fff/register&#fdba5e."
  action-blocked: "{prefix}&#fd5e5eNo puedes hacer eso hasta que inicies sesión."
  login-timeout: "&#fd5e5e&lTardaste demasiado en iniciar sesión."

security:
  locked-out: "{prefix}&#fd5e5eDemasiados intentos fallidos. Espera &#5e9dfd{seconds} segundos&#fd5e5e."

totp:
  enabled: "{prefix}&#91f251Verificación en dos pasos activada."
  disabled: "{prefix}&#91f251Verificación en dos pasos desactivada."
  setup-secret: "{prefix}&#fdba5eTu clave 2FA: &#fd8ddb{secret} &#fdba5e(añádela a tu app de autenticación y confirma con &#e39fff/2fa confirm <código>&#fdba5e)"
  usage: "{prefix}&#fd5e5eUso: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eLa autenticación en dos pasos está desactivada en este servidor."
  confirm-usage: "{prefix}&#fd5e5eUso: &#e39fff/2fa confirm <código>"
  already-enabled: "{prefix}&#fd5e5eYa tienes la verificación en dos pasos activada."
  not-enabled: "{prefix}&#fd5e5eNo tienes la verificación en dos pasos activada."

admin:
  no-permission: "{prefix}&#fd5e5eNo tienes permiso para hacer eso."
  reloaded: "{prefix}&#91f251Configuración recargada."
  unregistered: "{prefix}&#91f251Cuenta de &#fd8ddb{player} &#91f251eliminada."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251ha sido autenticado a la fuerza."
  player-not-found: "{prefix}&#fd5e5eJugador no encontrado."
  migration-started: "{prefix}&#fdba5eImportando cuentas desde &#fd8ddb{plugin}&#fdba5e..."
  migration-done: "{prefix}&#91f251Importación completa: &#fd8ddb{count} &#91f251cuentas importadas."
  migration-failed: "{prefix}&#fd5e5eError al importar: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> premium: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, último login: &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8Comandos: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5eSubcomando desconocido: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5eUso: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5eUso: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5eUso: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5eUso: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5eImportador desconocido: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5eCambia &#fd8ddbgeneral.language&#fdba5e en config.yml y ejecuta &#e39fff/rlogin reload&#fdba5e."
  changeuuid-usage: "{prefix}&#fd5e5eUso: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5eMueve solo la contraseña, el 2FA y la fecha de registro. El inventario, los permisos y la economía se quedan: pertenecen al mundo y a otros plugins."
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251Cuenta movida. Si ese jugador está conectado, tiene que volver a entrar."
  changeuuid-not-found: "{prefix}&#fd5e5eNo se encontró ninguna cuenta de rLogin para &#fd8ddb{input}&#fd5e5e."
  changeuuid-target-exists: "{prefix}&#fd5e5eEl destino ya tiene una cuenta de rLogin. Bórrala primero con &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5eOrigen y destino son el mismo UUID; no hay nada que hacer."
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid falló: &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lServidor mal configurado\n\n&#d4d9d8A este servidor le falta un plugin necesario, por eso nadie puede entrar.\n&#fdba5eAvisale a un administrador que instale PacketEvents:\n&#e39fff{link}"
  online-mode-conflict: "&#fd5e5e&lServidor mal configurado\n\n&#d4d9d8Este servidor tiene online-mode activado, así que los jugadores sin cuenta de Minecraft no pueden entrar.\n&#fdba5eDile a un administrador que ponga online-mode en false."


spawn:
  header: "{prefix}&#d4d9d8Spawns de rLogin:"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "sin definir (los jugadores se quedan donde salieron)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = entrada ya autenticada  &#fdba5efirstjoin&#d4d9d8 = primerísima entrada  &#fdba5elogin&#d4d9d8 = después de /login  &#fdba5eregister&#d4d9d8 = después de /register"
  usage: "{prefix}&#fd5e5eUso: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eMomento desconocido: &#fd8ddb{role}&#fd5e5e. Usa uno de: &#fd8ddb{roles}"
  set: "{prefix}&#91f251Spawn de &#fd8ddb{role}&#91f251 guardado donde estás parado: &#fd8ddb{location}"
  removed: "{prefix}&#91f251Spawn de &#fd8ddb{role}&#91f251 eliminado. Ahora los jugadores se quedan donde salieron."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e no tenía spawn definido."
  teleported: "{prefix}&#91f251Teletransportado al spawn de &#fd8ddb{role}&#91f251: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e no tiene spawn definido."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e apunta al mundo &#fd8ddb{world}&#fd5e5e, que no está cargado. Los jugadores se quedarían donde están."

recovery:
  usage: "{prefix}&#fd5e5eUso: /recover <código> <nueva contraseña>"
  disabled: "{prefix}&#fdba5eLa recuperación de cuentas está desactivada en este servidor."
  already-logged-in: "{prefix}&#fdba5eYa has iniciado sesión. Usa /changepassword."
  no-codes: "{prefix}&#fd5e5eA esta cuenta no le quedan códigos de recuperación. Habla con un administrador."
  wrong-code: "{prefix}&#fd5e5eEse código de recuperación no es válido."
  success: "{prefix}&#91f251Cuenta recuperada. Tu contraseña ha cambiado y el 2FA se ha desactivado. Te quedan &#fd8ddb{remaining}&#91f251 códigos."
  none-left: "{prefix}&#fdba5eEse era tu último código. Pídele a un administrador un juego nuevo."
  issued-header: "{prefix}&#fdba5eCódigos de recuperación - apúntalos ahora:"
  issued-entry: "&#fd8ddb  {code}"
  issued-footer: "{prefix}&#d4d9d8No se te volverán a mostrar. Cada uno sirve una vez y te permite poner una contraseña nueva si la olvidas."
