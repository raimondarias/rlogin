# rLogin mesajları — Türkçe
# Mesaja göre kullanılabilir placeholder'lar: {player} {seconds} {attempts} {min}
#
# Renk formatları — serbestçe karıştırılabilir:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Klasik kodlar: &a / §a (ve stiller için &l, &n..., sıfırlamak için &r)
#   3. Hex (BungeeCord/Spigot tarzı, bu dosyada varsayılan olarak kullanılır):
#      &#RRGGBB, §x§R§R§G§G§B§B, veya tek başına #RRGGBB

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

login:
  usage: "{prefix}&#fd5e5eKullanım: &#e39fff/login <şifre>"
  wrong-password: "{prefix}&#fd5e5eYanlış şifre. Kalan deneme: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eZaten giriş yaptın."
  success: "{prefix}&#91f251Giriş başarılı. Hoş geldin &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5e2FA kodunu da gir: &#e39fff/login <şifre> <kod>"
  wrong-totp: "{prefix}&#fd5e5eYanlış 2FA kodu."
  not-registered: "{prefix}&#fd5e5eBir hesabın yok. &#e39fff/register <şifre> <şifre> &#fd5e5eile kayıt ol"

register:
  usage: "{prefix}&#fd5e5eKullanım: &#e39fff/register <şifre> <şifreyi tekrarla>"
  already-registered: "{prefix}&#fd5e5eBu hesap zaten kayıtlı."
  passwords-dont-match: "{prefix}&#fd5e5eŞifreler eşleşmiyor."
  password-too-short: "{prefix}&#fd5e5eŞifre en az &#fd8ddb{min}&#fd5e5e karakter olmalı."
  premium-name-protected: "{prefix}&#fd5e5eBu isim premium bir hesaba ait. Eğer senin ise, orijinal Minecraft istemcisiyle bağlan."
  success: "{prefix}&#91f251Kayıt tamamlandı. Hoş geldin &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251Çıkış yapıldı."
  not-logged-in: "{prefix}&#fd5e5eGiriş yapmadın."

changepassword:
  usage: "{prefix}&#fd5e5eKullanım: &#e39fff/changepassword <mevcut şifre> <yeni şifre>"
  success: "{prefix}&#91f251Şifre başarıyla güncellendi."
  wrong-password: "{prefix}&#fd5e5eMevcut şifre yanlış."

premium:
  auto-login-message: "{prefix}&#91f251Premium hesap tespit edildi, oturum otomatik olarak başlatıldı."
  info-premium: "{prefix}&#91f251Hesabın Mojang tarafından premium olarak doğrulandı."
  info-cracked: "{prefix}&#fdba5eHesabın premium değil, kendi şifrene ihtiyacın var."

limbo:
  freeze-reminder: "{prefix}&#fdba5eHareket edebilmek için giriş yapmalısın. &#e39fff/login&#fdba5e veya &#e39fff/register&#fdba5e kullan."
  action-blocked: "{prefix}&#fd5e5eGiriş yapana kadar bunu yapamazsın."

security:
  locked-out: "{prefix}&#fd5e5eÇok fazla başarısız deneme. &#5e9dfd{seconds} saniye&#fd5e5e bekle."
  captcha-required: "{prefix}&#fdba5eDevam etmek için captcha'yı çöz: &#fd8ddb{captcha}"

totp:
  enabled: "{prefix}&#91f251İki faktörlü kimlik doğrulama etkinleştirildi."
  disabled: "{prefix}&#91f251İki faktörlü kimlik doğrulama devre dışı bırakıldı."
  setup-secret: "{prefix}&#fdba5e2FA anahtarın: &#fd8ddb{secret} &#fdba5e(kimlik doğrulama uygulamana ekle ve &#e39fff/2fa confirm <kod>&#fdba5e ile onayla)"
  confirm-usage: "{prefix}&#fd5e5eKullanım: &#e39fff/2fa confirm <kod>"
  already-enabled: "{prefix}&#fd5e5eİki faktörlü kimlik doğrulaman zaten etkin."
  not-enabled: "{prefix}&#fd5e5eİki faktörlü kimlik doğrulaman etkin değil."

admin:
  no-permission: "{prefix}&#fd5e5eBunu yapmak için iznin yok."
  reloaded: "{prefix}&#91f251Yapılandırma yeniden yüklendi."
  unregistered: "{prefix}&#91f251&#fd8ddb{player} &#91f251adlı oyuncunun hesabı silindi."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251zorla giriş yaptırıldı."
  player-not-found: "{prefix}&#fd5e5eOyuncu bulunamadı."
  migration-started: "{prefix}&#fdba5e&#fd8ddb{plugin} &#fdba5eüzerinden hesaplar içe aktarılıyor..."
  migration-done: "{prefix}&#91f251İçe aktarma tamamlandı: &#fd8ddb{count} &#91f251hesap aktarıldı."
  migration-failed: "{prefix}&#fd5e5eİçe aktarma hatası: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> premium: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, son giriş: &#5e9dfd{last-login}"
