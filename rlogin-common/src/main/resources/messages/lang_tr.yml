  premium-only: "&#fd5e5e&lBu sunucu yalnızca premium hesapları kabul eder.\n\n&#d4d9d8minecraft.net üzerinden Minecraft satın al veya sunucu sahibinden premium olmayan hesaplara izin vermesini iste."

