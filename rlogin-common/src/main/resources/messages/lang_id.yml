# Pesan rLogin — Bahasa Indonesia
# Placeholder yang tersedia tergantung pesan: {player} {seconds} {attempts} {min}
#
# Format warna — dapat digabung bebas:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Kode klasik: &a / §a (dan &l, &n... untuk gaya, &r untuk reset)
#   3. Hex (gaya BungeeCord/Spigot, default di file ini):
#      &#RRGGBB, §x§R§R§G§G§B§B, atau #RRGGBB tunggal

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eHanya pemain yang dapat menggunakan perintah ini."

login:
  usage: "{prefix}&#fd5e5ePenggunaan: &#e39fff/login <kata sandi>"
  wrong-password: "{prefix}&#fd5e5eKata sandi salah. Percobaan tersisa: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eKamu sudah login."
  success: "{prefix}&#91f251Berhasil login. Selamat datang &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5eMasukkan juga kode 2FA kamu: &#e39fff/login <kata sandi> <kode>"
  wrong-totp: "{prefix}&#fd5e5eKode 2FA salah."
  not-registered: "{prefix}&#fd5e5eKamu belum punya akun. Daftar dengan &#e39fff/register <kata sandi> <kata sandi>"
  session-restored: "{prefix}&#91f251Selamat datang kembali, {player}. Sesimu masih aktif."
  premium-only: "&#fd5e5e&lServer ini hanya menerima akun premium.\n\n&#d4d9d8Beli Minecraft di minecraft.net, atau minta pemilik server mengizinkan akun non-premium."

register:
  usage: "{prefix}&#fd5e5ePenggunaan: &#e39fff/register <kata sandi> <ulangi kata sandi>"
  already-registered: "{prefix}&#fd5e5eAkun ini sudah terdaftar."
  passwords-dont-match: "{prefix}&#fd5e5eKata sandi tidak cocok."
  password-too-short: "{prefix}&#fd5e5eKata sandi harus minimal &#fd8ddb{min}&#fd5e5e karakter."
  premium-name-protected: "{prefix}&#fd5e5eNama ini milik akun premium. Jika ini milikmu, sambungkan dengan client Minecraft asli."
  too-many-from-ip: "{prefix}&#fd5e5eTerlalu banyak akun dibuat dari alamatmu. Coba lagi dalam &#fd8ddb{seconds}&#fd5e5es."
  password-too-common: "{prefix}&#fd5e5eKata sandi itu termasuk yang paling umum. Pilih yang lain."
  password-is-name: "{prefix}&#fd5e5eKata sandimu tidak boleh berupa namamu sendiri."
  success: "{prefix}&#91f251Pendaftaran selesai. Selamat datang &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251Berhasil logout."
  not-logged-in: "{prefix}&#fd5e5eKamu belum login."

changepassword:
  usage: "{prefix}&#fd5e5ePenggunaan: &#e39fff/changepassword <kata sandi saat ini> <kata sandi baru>"
  success: "{prefix}&#91f251Kata sandi berhasil diperbarui."
  wrong-password: "{prefix}&#fd5e5eKata sandi saat ini salah."

premium:
  auto-login-message: "{prefix}&#91f251Akun premium terdeteksi, sesi dimulai secara otomatis."
  info-premium: "{prefix}&#91f251Akunmu terverifikasi sebagai premium oleh Mojang."
  info-cracked: "{prefix}&#fdba5eAkunmu bukan premium, kamu memerlukan kata sandi sendiri."

limbo:
  freeze-reminder: "{prefix}&#fdba5eKamu harus login untuk bisa bergerak. Gunakan &#e39fff/login&#fdba5e atau &#e39fff/register&#fdba5e."
  action-blocked: "{prefix}&#fd5e5eKamu tidak bisa melakukan itu sampai kamu login."
  login-timeout: "&#fd5e5e&lKamu terlalu lama untuk masuk."

security:
  locked-out: "{prefix}&#fd5e5eTerlalu banyak percobaan gagal. Tunggu &#5e9dfd{seconds} detik&#fd5e5e."

totp:
  enabled: "{prefix}&#91f251Autentikasi dua faktor diaktifkan."
  disabled: "{prefix}&#91f251Autentikasi dua faktor dinonaktifkan."
  setup-secret: "{prefix}&#fdba5eKunci 2FA kamu: &#fd8ddb{secret} &#fdba5e(tambahkan ke aplikasi autentikator dan konfirmasi dengan &#e39fff/2fa confirm <kode>&#fdba5e)"
  usage: "{prefix}&#fd5e5ePenggunaan: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eAutentikasi dua faktor dinonaktifkan di server ini."
  confirm-usage: "{prefix}&#fd5e5ePenggunaan: &#e39fff/2fa confirm <kode>"
  already-enabled: "{prefix}&#fd5e5eKamu sudah mengaktifkan autentikasi dua faktor."
  not-enabled: "{prefix}&#fd5e5eKamu belum mengaktifkan autentikasi dua faktor."

admin:
  no-permission: "{prefix}&#fd5e5eKamu tidak punya izin untuk melakukan itu."
  reloaded: "{prefix}&#91f251Konfigurasi dimuat ulang."
  unregistered: "{prefix}&#91f251Akun &#fd8ddb{player} &#91f251telah dihapus."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251telah dipaksa login."
  player-not-found: "{prefix}&#fd5e5ePemain tidak ditemukan."
  migration-started: "{prefix}&#fdba5eMengimpor akun dari &#fd8ddb{plugin}&#fdba5e..."
  migration-done: "{prefix}&#91f251Impor selesai: &#fd8ddb{count} &#91f251akun berhasil diimpor."
  migration-failed: "{prefix}&#fd5e5eKesalahan impor: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> premium: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, login terakhir: &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8Perintah: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5eSubperintah tidak dikenal: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5ePenggunaan: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5ePenggunaan: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5ePenggunaan: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5ePenggunaan: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5eImporter tidak dikenal: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5eUbah &#fd8ddbgeneral.language&#fdba5e di config.yml lalu jalankan &#e39fff/rlogin reload&#fdba5e."
  version: "{prefix}&#d4d9d8Menjalankan rLogin &#fd8ddb{version}&#d4d9d8 (&#fd8ddb{platform}&#d4d9d8)."
  version-outdated: "{prefix}&#fdba5erLogin &#fd8ddb{latest}&#fdba5e sudah tersedia: &#fd8ddb{url}&#fdba5e"
  version-latest: "{prefix}&#91f251Kamu menjalankan rilis terbaru."
  version-ahead: "{prefix}&#fdba5eKamu menjalankan build yang lebih baru dari rilis terbaru (&#fd8ddb{latest}&#fdba5e)."
  version-unknown: "{prefix}&#fdba5eTidak dapat memeriksa pembaruan."
  changeuuid-usage: "{prefix}&#fd5e5ePenggunaan: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5eMemindahkan kata sandi, 2FA, dan tanggal daftar. Dengan LuckPerms terpasang, rank ikut pindah; inventaris dan ekonomi tetap - itu milik dunia dan plugin lain."
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251Akun dipindahkan. Jika pemain itu sedang terhubung, ia harus masuk lagi."
  changeuuid-perms-moved: "{prefix}&#91f251Rank LuckPerms-nya ikut dipindahkan."
  changeuuid-perms-target-not-empty: "{prefix}&#fdba5eLuckPerms tidak disentuh: UUID baru sudah punya izin sendiri."
  changeuuid-perms-failed: "{prefix}&#fd5e5eTidak bisa menyalin rank LuckPerms. Lihat konsol."
  changeuuid-not-found: "{prefix}&#fd5e5eTidak ada akun rLogin untuk &#fd8ddb{input}&#fd5e5e."
  changeuuid-target-exists: "{prefix}&#fd5e5eTujuan sudah punya akun rLogin. Hapus dulu dengan &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5eSumber dan tujuan adalah UUID yang sama; tidak ada yang perlu dilakukan."
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid gagal: &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lServer salah konfigurasi\n\n&#d4d9d8Server ini kekurangan plugin yang diperlukan, jadi tidak ada yang bisa masuk.\n&#fdba5eBeri tahu administrator untuk memasang PacketEvents:\n&#e39fff{link}"
  online-mode-conflict: "&#fd5e5e&lServer salah konfigurasi\n\n&#d4d9d8Server ini mengaktifkan online-mode, sehingga pemain tanpa akun Minecraft sama sekali tidak bisa masuk.\n&#fdba5eBeri tahu administrator untuk mengatur online-mode menjadi false."


spawn:
  header: "{prefix}&#d4d9d8Titik spawn rLogin:"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "belum diatur (pemain tetap di tempat mereka keluar)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = masuk yang sudah terverifikasi  &#fdba5efirstjoin&#d4d9d8 = masuk pertama kali  &#fdba5elogin&#d4d9d8 = setelah /login  &#fdba5eregister&#d4d9d8 = setelah /register"
  usage: "{prefix}&#fd5e5ePenggunaan: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eMomen tidak dikenal: &#fd8ddb{role}&#fd5e5e. Gunakan salah satu: &#fd8ddb{roles}"
  set: "{prefix}&#91f251Spawn untuk &#fd8ddb{role}&#91f251 disimpan di tempat kamu berdiri: &#fd8ddb{location}"
  removed: "{prefix}&#91f251Spawn untuk &#fd8ddb{role}&#91f251 dihapus. Pemain kini tetap di tempat mereka keluar."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e belum punya spawn."
  teleported: "{prefix}&#91f251Diteleportasi ke spawn &#fd8ddb{role}&#91f251: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e belum punya spawn."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e menunjuk ke dunia &#fd8ddb{world}&#fd5e5e yang belum dimuat. Pemain akan tetap di tempatnya."

recovery:
  usage: "{prefix}&#fd5e5ePenggunaan: /recover <kode> <kata sandi baru>"
  disabled: "{prefix}&#fdba5ePemulihan akun dimatikan di server ini."
  already-logged-in: "{prefix}&#fdba5eKamu sudah masuk. Gunakan /changepassword."
  no-codes: "{prefix}&#fd5e5eAkun ini tidak punya sisa kode pemulihan. Hubungi administrator."
  wrong-code: "{prefix}&#fd5e5eKode pemulihan itu tidak valid."
  success: "{prefix}&#91f251Akun dipulihkan. Kata sandi diubah dan 2FA dimatikan. Sisa &#fd8ddb{remaining}&#91f251 kode."
  none-left: "{prefix}&#fdba5eItu kode terakhirmu. Minta administrator satu set baru."
  issued-header: "{prefix}&#fdba5eKode pemulihan - catat sekarang:"
  issued-entry: "&#fd8ddb  {code}"
  issued-footer: "{prefix}&#d4d9d8Ini tidak akan ditampilkan lagi. Tiap kode berlaku sekali dan bisa dipakai menyetel kata sandi baru."
