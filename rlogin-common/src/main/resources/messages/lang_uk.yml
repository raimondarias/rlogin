  disabled: "{prefix}&#fdba5eВідновлення акаунта на цьому сервері вимкнено."
  already-logged-in: "{prefix}&#fdba5eВи вже увійшли. Використайте /changepassword."
  no-codes: "{prefix}&#fd5e5eУ цього акаунта не залишилося кодів відновлення. Зверніться до адміністратора."
  wrong-code: "{prefix}&#fd5e5eЦей код відновлення недійсний."
