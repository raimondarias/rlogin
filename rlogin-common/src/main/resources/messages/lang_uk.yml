  success: "{prefix}&#91f251Акаунт відновлено. Пароль змінено, 2FA вимкнено. Залишилось кодів: &#fd8ddb{remaining}&#91f251."
  none-left: "{prefix}&#fdba5eЦе був останній код. Попросіть в адміністратора новий набір."
  issued-header: "{prefix}&#fdba5eКоди відновлення - запишіть їх зараз:"
  issued-entry: "&#fd8ddb  {code}"
  issued-footer: "{prefix}&#d4d9d8Більше їх не покажуть. Кожен працює один раз і дозволяє задати новий пароль."
