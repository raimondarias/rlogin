  changeuuid-failed: "{prefix}&#fd5e5echangeuuid не вдався: &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lСервер налаштовано неправильно\n\n&#d4d9d8На цьому сервері бракує потрібного плагіна, тому ніхто не може зайти.\n&#fdba5eСкажіть адміністратору встановити PacketEvents:\n&#e39fff{link}"
  online-mode-conflict: "&#fd5e5e&lСервер налаштовано неправильно\n\n&#d4d9d8На цьому сервері увімкнено online-mode, тому гравці без акаунта Minecraft не можуть зайти.\n&#fdba5eСкажіть адміністратору встановити online-mode у false."


spawn:
  header: "{prefix}&#d4d9d8Спавни rLogin:"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "не задано (гравці лишаються там, де вийшли)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = вхід уже підтверджено  &#fdba5efirstjoin&#d4d9d8 = найперший вхід  &#fdba5elogin&#d4d9d8 = після /login  &#fdba5eregister&#d4d9d8 = після /register"
  usage: "{prefix}&#fd5e5eВикористання: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eНевідомий момент: &#fd8ddb{role}&#fd5e5e. Використайте один із: &#fd8ddb{roles}"
  set: "{prefix}&#91f251Спавн для &#fd8ddb{role}&#91f251 збережено там, де ви стоїте: &#fd8ddb{location}"
  removed: "{prefix}&#91f251Спавн для &#fd8ddb{role}&#91f251 видалено. Тепер гравці лишаються там, де вийшли."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e: спавн не було задано."
  teleported: "{prefix}&#91f251Телепортовано на спавн &#fd8ddb{role}&#91f251: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e: спавн не задано."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e вказує на світ &#fd8ddb{world}&#fd5e5e, який не завантажено. Гравці лишилися б на місці."

