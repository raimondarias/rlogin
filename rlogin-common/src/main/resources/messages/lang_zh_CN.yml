# rLogin 消息 — 简体中文
# 可用占位符视消息而定：{player} {seconds} {attempts} {min}
#
# 颜色格式 — 可自由混用：
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. 传统代码: &a / §a（以及 &l、&n 等样式，&r 重置）
#   3. 十六进制（BungeeCord/Spigot 风格，本文件默认使用）:
#      &#RRGGBB, §x§R§R§G§G§B§B, 或单独的 #RRGGBB

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5e只有玩家才能使用该命令。"

login:
  usage: "{prefix}&#fd5e5e用法: &#e39fff/login <密码>"
  wrong-password: "{prefix}&#fd5e5e密码错误。剩余尝试次数: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5e你已经登录了。"
  success: "{prefix}&#91f251登录成功。欢迎 &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5e还需要输入你的2FA验证码: &#e39fff/login <密码> <验证码>"
  wrong-totp: "{prefix}&#fd5e5e2FA验证码错误。"
  not-registered: "{prefix}&#fd5e5e你还没有账号。请使用 &#e39fff/register <密码> <密码> &#fd5e5e注册"
  session-restored: "{prefix}&#91f251欢迎回来，{player}。你的会话仍然有效。"

register:
  usage: "{prefix}&#fd5e5e用法: &#e39fff/register <密码> <重复密码>"
  already-registered: "{prefix}&#fd5e5e该账号已注册。"
  passwords-dont-match: "{prefix}&#fd5e5e两次输入的密码不一致。"
  password-too-short: "{prefix}&#fd5e5e密码长度至少需要 &#fd8ddb{min} &#fd5e5e个字符。"
  premium-name-protected: "{prefix}&#fd5e5e该用户名属于正版账号。如果这是你的用户名，请使用原版Minecraft客户端连接。"
  success: "{prefix}&#91f251注册完成。欢迎 &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251已注销登录。"
  not-logged-in: "{prefix}&#fd5e5e你还没有登录。"

changepassword:
  usage: "{prefix}&#fd5e5e用法: &#e39fff/changepassword <当前密码> <新密码>"
  success: "{prefix}&#91f251密码修改成功。"
  wrong-password: "{prefix}&#fd5e5e当前密码不正确。"

premium:
  auto-login-message: "{prefix}&#91f251检测到正版账号，已自动开始会话。"
  info-premium: "{prefix}&#91f251你的账号已通过Mojang验证为正版。"
  info-cracked: "{prefix}&#fdba5e你的账号不是正版，需要设置自己的密码。"

limbo:
  freeze-reminder: "{prefix}&#fdba5e你需要登录才能移动。请使用 &#e39fff/login&#fdba5e 或 &#e39fff/register&#fdba5e。"
  action-blocked: "{prefix}&#fd5e5e在登录之前你不能这样做。"

security:
  locked-out: "{prefix}&#fd5e5e失败尝试次数过多。请等待 &#5e9dfd{seconds} 秒&#fd5e5e。"

totp:
  enabled: "{prefix}&#91f251双重验证已启用。"
  disabled: "{prefix}&#91f251双重验证已禁用。"
  setup-secret: "{prefix}&#fdba5e你的2FA密钥: &#fd8ddb{secret} &#fdba5e（将其添加到你的验证器应用中，并使用 &#e39fff/2fa confirm <验证码>&#fdba5e 确认）"
  usage: "{prefix}&#fd5e5e用法：&#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5e本服务器已关闭两步验证。"
  confirm-usage: "{prefix}&#fd5e5e用法: &#e39fff/2fa confirm <验证码>"
  already-enabled: "{prefix}&#fd5e5e你已经启用了双重验证。"
  not-enabled: "{prefix}&#fd5e5e你还没有启用双重验证。"

admin:
  no-permission: "{prefix}&#fd5e5e你没有权限执行此操作。"
  reloaded: "{prefix}&#91f251配置已重新加载。"
  unregistered: "{prefix}&#91f251&#fd8ddb{player} &#91f251的账号已被删除。"
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251已被强制登录。"
  player-not-found: "{prefix}&#fd5e5e未找到该玩家。"
  migration-started: "{prefix}&#fdba5e正在从 &#fd8ddb{plugin} &#fdba5e导入账号..."
  migration-done: "{prefix}&#91f251导入完成: 共导入 &#fd8ddb{count} &#91f251个账号。"
  migration-failed: "{prefix}&#fd5e5e导入错误: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> 正版: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, 最后登录: &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8命令: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5e未知子命令: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5e用法: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5e用法: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5e用法: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5e用法: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5e未知导入器: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5e在 config.yml 中修改 &#fd8ddbgeneral.language&#fdba5e，然后执行 &#e39fff/rlogin reload&#fdba5e。"
  changeuuid-usage: "{prefix}&#fd5e5e用法: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5e只迁移密码、两步验证和注册日期。背包、权限和经济不会迁移：它们属于世界和其他插件。"
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251账户已迁移。如果该玩家在线，需要重新进入。"
  changeuuid-not-found: "{prefix}&#fd5e5e未找到该名称的 rLogin 账户：&#fd8ddb{input}&#fd5e5e"
  changeuuid-target-exists: "{prefix}&#fd5e5e目标已有 rLogin 账户。请先用此命令删除：&#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5e来源和目标是同一个 UUID，无需处理。"
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid 失败：&#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&l服务器配置错误\n\n&#d4d9d8本服务器缺少必需的插件，因此没有人能够进入。\n&#fdba5e请让管理员安装 PacketEvents：\n&#e39fff{link}"


spawn:
  header: "{prefix}&#d4d9d8rLogin 出生点："
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "未设置（玩家停留在退出的位置）"
  roles-help: "&#fdba5ejoin&#d4d9d8 = 已验证的进入  &#fdba5efirstjoin&#d4d9d8 = 第一次进入  &#fdba5elogin&#d4d9d8 = /login 之后  &#fdba5eregister&#d4d9d8 = /register 之后"
  usage: "{prefix}&#fd5e5e用法: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5e未知时机: &#fd8ddb{role}&#fd5e5e. 请使用其中之一：&#fd8ddb{roles}"
  set: "{prefix}&#91f251&#fd8ddb{role}&#91f251 的出生点已设置为你当前位置：&#fd8ddb{location}"
  removed: "{prefix}&#91f251&#fd8ddb{role}&#91f251 的出生点已移除。玩家现在停留在退出的位置。"
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e 没有设置出生点。"
  teleported: "{prefix}&#91f251已传送到 &#fd8ddb{role}&#91f251 出生点：&#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e 没有设置出生点。"
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e 指向世界 &#fd8ddb{world}&#fd5e5e，但该世界未加载。玩家将停留在原地。"