# Mensagens do rLogin — Português (Brasil)
# Placeholders disponíveis conforme a mensagem: {player} {seconds} {attempts} {min}
#
# Formatos de cor — podem ser misturados livremente:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Códigos clássicos: &a / §a (e &l, &n... para estilos, &r para reset)
#   3. Hex (estilo BungeeCord/Spigot, usado por padrão neste arquivo):
#      &#RRGGBB, §x§R§R§G§G§B§B, ou um #RRGGBB solto

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eApenas um jogador pode usar este comando."

login:
  usage: "{prefix}&#fd5e5eUso: &#e39fff/login <senha>"
  wrong-password: "{prefix}&#fd5e5eSenha incorreta. Tentativas restantes: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eVocê já está conectado."
  success: "{prefix}&#91f251Login realizado com sucesso. Bem-vindo &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5eDigite também seu código 2FA: &#e39fff/login <senha> <código>"
  wrong-totp: "{prefix}&#fd5e5eCódigo 2FA incorreto."
  not-registered: "{prefix}&#fd5e5eVocê não tem uma conta. Registre-se com &#e39fff/register <senha> <senha>"
  session-restored: "{prefix}&#91f251Bem-vindo de volta, {player}. Sua sessão ainda estava ativa."
  premium-only: "&#fd5e5e&lEste servidor só aceita contas premium.\n\n&#d4d9d8Compre Minecraft em minecraft.net, ou peça ao dono para permitir contas não premium."

register:
  usage: "{prefix}&#fd5e5eUso: &#e39fff/register <senha> <repita a senha>"
  already-registered: "{prefix}&#fd5e5eEsta conta já está registrada."
  passwords-dont-match: "{prefix}&#fd5e5eAs senhas não coincidem."
  password-too-short: "{prefix}&#fd5e5eA senha deve ter pelo menos &#fd8ddb{min}&#fd5e5e caracteres."
  premium-name-protected: "{prefix}&#fd5e5eEsse nome pertence a uma conta premium. Se for sua, conecte-se com o cliente original do Minecraft."
  success: "{prefix}&#91f251Registro concluído. Bem-vindo &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251Sessão encerrada."
  not-logged-in: "{prefix}&#fd5e5eVocê não está conectado."

changepassword:
  usage: "{prefix}&#fd5e5eUso: &#e39fff/changepassword <senha atual> <nova senha>"
  success: "{prefix}&#91f251Senha atualizada com sucesso."
  wrong-password: "{prefix}&#fd5e5eA senha atual está incorreta."

premium:
  auto-login-message: "{prefix}&#91f251Conta premium detectada, sessão iniciada automaticamente."
  info-premium: "{prefix}&#91f251Sua conta está verificada como premium pela Mojang."
  info-cracked: "{prefix}&#fdba5eSua conta não é premium, você precisa da sua própria senha."

limbo:
  freeze-reminder: "{prefix}&#fdba5eVocê precisa fazer login para poder se mover. Use &#e39fff/login&#fdba5e ou &#e39fff/register&#fdba5e."
  action-blocked: "{prefix}&#fd5e5eVocê não pode fazer isso até fazer login."
  login-timeout: "&#fd5e5e&lVocê demorou demais para entrar."

security:
  locked-out: "{prefix}&#fd5e5eMuitas tentativas falharam. Espere &#5e9dfd{seconds} segundos&#fd5e5e."

totp:
  enabled: "{prefix}&#91f251Autenticação de dois fatores ativada."
  disabled: "{prefix}&#91f251Autenticação de dois fatores desativada."
  setup-secret: "{prefix}&#fdba5eSua chave 2FA: &#fd8ddb{secret} &#fdba5e(adicione-a ao seu app autenticador e confirme com &#e39fff/2fa confirm <código>&#fdba5e)"
  usage: "{prefix}&#fd5e5eUso: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eA autenticação de dois fatores está desativada neste servidor."
  confirm-usage: "{prefix}&#fd5e5eUso: &#e39fff/2fa confirm <código>"
  already-enabled: "{prefix}&#fd5e5eVocê já tem a autenticação de dois fatores ativada."
  not-enabled: "{prefix}&#fd5e5eVocê não tem a autenticação de dois fatores ativada."

admin:
  no-permission: "{prefix}&#fd5e5eVocê não tem permissão para fazer isso."
  reloaded: "{prefix}&#91f251Configuração recarregada."
  unregistered: "{prefix}&#91f251A conta de &#fd8ddb{player} &#91f251foi excluída."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251foi autenticado à força."
  player-not-found: "{prefix}&#fd5e5eJogador não encontrado."
  migration-started: "{prefix}&#fdba5eImportando contas de &#fd8ddb{plugin}&#fdba5e..."
  migration-done: "{prefix}&#91f251Importação concluída: &#fd8ddb{count} &#91f251contas importadas."
  migration-failed: "{prefix}&#fd5e5eErro ao importar: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> premium: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, último login: &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8Comandos: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5eSubcomando desconhecido: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5eUso: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5eUso: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5eUso: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5eUso: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5eImportador desconhecido: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5eAltere &#fd8ddbgeneral.language&#fdba5e no config.yml e execute &#e39fff/rlogin reload&#fdba5e."
  changeuuid-usage: "{prefix}&#fd5e5eUso: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5eMove apenas a senha, o 2FA e a data de registro. Inventário, permissões e economia ficam: pertencem ao mundo e a outros plugins."
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251Conta movida. Se esse jogador estiver conectado, precisa entrar de novo."
  changeuuid-not-found: "{prefix}&#fd5e5eNenhuma conta do rLogin encontrada para &#fd8ddb{input}&#fd5e5e."
  changeuuid-target-exists: "{prefix}&#fd5e5eO destino já tem uma conta do rLogin. Apague-a primeiro com &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5eOrigem e destino são o mesmo UUID; nada a fazer."
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid falhou: &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lServidor mal configurado\n\n&#d4d9d8Falta um plugin necessário neste servidor, por isso ninguém consegue entrar.\n&#fdba5eAvise um administrador para instalar o PacketEvents:\n&#e39fff{link}"
  online-mode-conflict: "&#fd5e5e&lServidor mal configurado\n\n&#d4d9d8Este servidor está com online-mode ativado, então jogadores sem conta de Minecraft não conseguem entrar.\n&#fdba5ePeça a um administrador para definir online-mode como false."


spawn:
  header: "{prefix}&#d4d9d8Spawns do rLogin:"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "não definido (os jogadores ficam onde saíram)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = entrada já autenticada  &#fdba5efirstjoin&#d4d9d8 = primeira entrada de todas  &#fdba5elogin&#d4d9d8 = depois de /login  &#fdba5eregister&#d4d9d8 = depois de /register"
  usage: "{prefix}&#fd5e5eUso: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eMomento desconhecido: &#fd8ddb{role}&#fd5e5e. Use um destes: &#fd8ddb{roles}"
  set: "{prefix}&#91f251Spawn de &#fd8ddb{role}&#91f251 salvo onde você está: &#fd8ddb{location}"
  removed: "{prefix}&#91f251Spawn de &#fd8ddb{role}&#91f251 removido. Agora os jogadores ficam onde saíram."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e não tinha spawn definido."
  teleported: "{prefix}&#91f251Teletransportado para o spawn de &#fd8ddb{role}&#91f251: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e não tem spawn definido."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e aponta para o mundo &#fd8ddb{world}&#fd5e5e, que não está carregado. Os jogadores ficariam onde estão."