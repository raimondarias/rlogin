# rLogin 메시지 — 한국어
# 메시지에 따라 사용 가능한 플레이스홀더: {player} {seconds} {attempts} {min}
#
# 색상 형식 — 자유롭게 조합 가능:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. 클래식 코드: &a / §a (스타일용 &l, &n..., 초기화용 &r)
#   3. 헥스 (BungeeCord/Spigot 스타일, 이 파일의 기본값):
#      &#RRGGBB, §x§R§R§G§G§B§B, 또는 단독 #RRGGBB

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5e이 명령어는 플레이어만 사용할 수 있습니다."

login:
  usage: "{prefix}&#fd5e5e사용법: &#e39fff/login <비밀번호>"
  wrong-password: "{prefix}&#fd5e5e비밀번호가 틀렸습니다. 남은 시도 횟수: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5e이미 로그인되어 있습니다."
  success: "{prefix}&#91f251로그인에 성공했습니다. 환영합니다, &#fd8ddb{player}&#91f251님!"
  need-totp: "{prefix}&#fdba5e2FA 코드도 입력하세요: &#e39fff/login <비밀번호> <코드>"
  wrong-totp: "{prefix}&#fd5e5e2FA 코드가 틀렸습니다."
  not-registered: "{prefix}&#fd5e5e계정이 없습니다. &#e39fff/register <비밀번호> <비밀번호> &#fd5e5e로 가입하세요"
  session-restored: "{prefix}&#91f251다시 오신 것을 환영합니다, {player}. 세션이 아직 유효했습니다."

register:
  usage: "{prefix}&#fd5e5e사용법: &#e39fff/register <비밀번호> <비밀번호 확인>"
  already-registered: "{prefix}&#fd5e5e이 계정은 이미 등록되어 있습니다."
  passwords-dont-match: "{prefix}&#fd5e5e비밀번호가 일치하지 않습니다."
  password-too-short: "{prefix}&#fd5e5e비밀번호는 최소 &#fd8ddb{min}&#fd5e5e자 이상이어야 합니다."
  premium-name-protected: "{prefix}&#fd5e5e이 이름은 프리미엄 계정에 속해 있습니다. 본인 계정이라면 정품 Minecraft 클라이언트로 접속하세요."
  success: "{prefix}&#91f251가입이 완료되었습니다. 환영합니다, &#fd8ddb{player}&#91f251님!"

logout:
  success: "{prefix}&#91f251로그아웃되었습니다."
  not-logged-in: "{prefix}&#fd5e5e로그인되어 있지 않습니다."

changepassword:
  usage: "{prefix}&#fd5e5e사용법: &#e39fff/changepassword <현재 비밀번호> <새 비밀번호>"
  success: "{prefix}&#91f251비밀번호가 성공적으로 변경되었습니다."
  wrong-password: "{prefix}&#fd5e5e현재 비밀번호가 올바르지 않습니다."

premium:
