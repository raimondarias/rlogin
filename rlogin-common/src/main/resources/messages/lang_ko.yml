  info-premium: "{prefix}&#91f251회원님의 계정은 Mojang에서 프리미엄으로 확인되었습니다."
  info-cracked: "{prefix}&#fdba5e회원님의 계정은 프리미엄이 아니므로 자신만의 비밀번호가 필요합니다."

limbo:
  freeze-reminder: "{prefix}&#fdba5e움직이려면 로그인해야 합니다. &#e39fff/login&#fdba5e 또는 &#e39fff/register&#fdba5e 를 사용하세요."
  action-blocked: "{prefix}&#fd5e5e로그인하기 전까지는 그 작업을 할 수 없습니다."

