totp:
  enabled: "{prefix}&#91f2512단계 인증이 활성화되었습니다."
  disabled: "{prefix}&#91f2512단계 인증이 비활성화되었습니다."
  setup-secret: "{prefix}&#fdba5e회원님의 2FA 키: &#fd8ddb{secret} &#fdba5e(인증 앱에 추가한 후 &#e39fff/2fa confirm <코드>&#fdba5e 로 확인하세요)"
  usage: "{prefix}&#fd5e5e사용법: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5e이 서버에서는 2단계 인증이 비활성화되어 있습니다."
  confirm-usage: "{prefix}&#fd5e5e사용법: &#e39fff/2fa confirm <코드>"
  already-enabled: "{prefix}&#fd5e5e이미 2단계 인증이 활성화되어 있습니다."
  not-enabled: "{prefix}&#fd5e5e2단계 인증이 활성화되어 있지 않습니다."

admin:
  no-permission: "{prefix}&#fd5e5e그 작업을 수행할 권한이 없습니다."
  reloaded: "{prefix}&#91f251설정이 다시 불러와졌습니다."
  unregistered: "{prefix}&#91f251&#fd8ddb{player}&#91f251님의 계정이 삭제되었습니다."
  force-logged-in: "{prefix}&#fd8ddb{player}&#91f251님이 강제로 로그인되었습니다."
  player-not-found: "{prefix}&#fd5e5e플레이어를 찾을 수 없습니다."
  migration-started: "{prefix}&#fdba5e&#fd8ddb{plugin}&#fdba5e에서 계정을 가져오는 중..."
  migration-done: "{prefix}&#91f251가져오기 완료: &#fd8ddb{count}&#91f251개의 계정을 가져왔습니다."
  migration-failed: "{prefix}&#fd5e5e가져오기 오류: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> 프리미엄: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, 마지막 로그인: &#5e9dfd{last-login}"
