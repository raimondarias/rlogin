  usage: "{prefix}&#fd5e5e사용법: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5e알 수 없는 시점: &#fd8ddb{role}&#fd5e5e. 다음 중 하나를 사용하세요: &#fd8ddb{roles}"
  set: "{prefix}&#91f251&#fd8ddb{role}&#91f251 스폰을 현재 위치로 설정했습니다: &#fd8ddb{location}"
  removed: "{prefix}&#91f251&#fd8ddb{role}&#91f251 스폰을 제거했습니다. 이제 플레이어는 나갔던 자리에 남습니다."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e 에는 스폰이 설정되어 있지 않았습니다."
  teleported: "{prefix}&#91f251&#fd8ddb{role}&#91f251 스폰으로 이동했습니다: &#fd8ddb{location}"
