# rLogin メッセージ — 日本語
# メッセージごとに利用できるプレースホルダー: {player} {seconds} {attempts} {min}
#
# カラーフォーマット — 自由に組み合わせ可能:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. クラシックコード: &a / §a（スタイル用の &l, &n... リセット用の &r）
#   3. 16進数（BungeeCord/Spigot形式、このファイルの既定値）:
#      &#RRGGBB, §x§R§R§G§G§B§B, または単独の #RRGGBB

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eこのコマンドはプレイヤーのみ使用できます。"

login:
  usage: "{prefix}&#fd5e5e使い方: &#e39fff/login <パスワード>"
  wrong-password: "{prefix}&#fd5e5eパスワードが間違っています。残り試行回数: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eすでにログインしています。"
  success: "{prefix}&#91f251ログインに成功しました。ようこそ &#fd8ddb{player}&#91f251！"
  need-totp: "{prefix}&#fdba5e2FAコードも入力してください: &#e39fff/login <パスワード> <コード>"
  wrong-totp: "{prefix}&#fd5e5e2FAコードが間違っています。"
  not-registered: "{prefix}&#fd5e5eアカウントがありません。&#e39fff/register <パスワード> <パスワード> &#fd5e5eで登録してください"
  session-restored: "{prefix}&#91f251おかえりなさい、{player}。セッションはまだ有効でした。"

register:
  usage: "{prefix}&#fd5e5e使い方: &#e39fff/register <パスワード> <パスワード（確認）>"
  already-registered: "{prefix}&#fd5e5eこのアカウントはすでに登録されています。"
  passwords-dont-match: "{prefix}&#fd5e5eパスワードが一致しません。"
  password-too-short: "{prefix}&#fd5e5eパスワードは&#fd8ddb{min}&#fd5e5e文字以上である必要があります。"
  premium-name-protected: "{prefix}&#fd5e5eその名前はプレミアムアカウントに属しています。あなたのものであれば、正規のMinecraftクライアントで接続してください。"
  success: "{prefix}&#91f251登録が完了しました。ようこそ &#fd8ddb{player}&#91f251！"

logout:
  success: "{prefix}&#91f251ログアウトしました。"
  not-logged-in: "{prefix}&#fd5e5eログインしていません。"

changepassword:
  usage: "{prefix}&#fd5e5e使い方: &#e39fff/changepassword <現在のパスワード> <新しいパスワード>"
  success: "{prefix}&#91f251パスワードを更新しました。"
  wrong-password: "{prefix}&#fd5e5e現在のパスワードが間違っています。"

premium:
  auto-login-message: "{prefix}&#91f251プレミアムアカウントを検出しました。セッションが自動的に開始されました。"
  info-premium: "{prefix}&#91f251あなたのアカウントはMojangによってプレミアムとして認証されています。"
  info-cracked: "{prefix}&#fdba5eあなたのアカウントはプレミアムではありません。独自のパスワードが必要です。"

limbo:
  freeze-reminder: "{prefix}&#fdba5e移動するにはログインが必要です。&#e39fff/login&#fdba5e または &#e39fff/register&#fdba5e を使用してください。"
  action-blocked: "{prefix}&#fd5e5eログインするまでその操作はできません。"

security:
  locked-out: "{prefix}&#fd5e5e失敗した試行回数が多すぎます。&#5e9dfd{seconds}秒&#fd5e5e待ってください。"

totp:
  enabled: "{prefix}&#91f251二要素認証が有効になりました。"
  disabled: "{prefix}&#91f251二要素認証が無効になりました。"
  setup-secret: "{prefix}&#fdba5eあなたの2FAキー: &#fd8ddb{secret} &#fdba5e（認証アプリに追加し、&#e39fff/2fa confirm <コード>&#fdba5e で確認してください）"
  usage: "{prefix}&#fd5e5e使い方: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eこのサーバーでは二段階認証が無効になっています。"
  confirm-usage: "{prefix}&#fd5e5e使い方: &#e39fff/2fa confirm <コード>"
  already-enabled: "{prefix}&#fd5e5eすでに二要素認証が有効になっています。"
  not-enabled: "{prefix}&#fd5e5e二要素認証が有効になっていません。"

admin:
  no-permission: "{prefix}&#fd5e5eこの操作を行う権限がありません。"
  reloaded: "{prefix}&#91f251設定を再読み込みしました。"
  unregistered: "{prefix}&#91f251&#fd8ddb{player} &#91f251のアカウントが削除されました。"
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251を強制的にログインさせました。"
  player-not-found: "{prefix}&#fd5e5eプレイヤーが見つかりません。"
  migration-started: "{prefix}&#fdba5e&#fd8ddb{plugin} &#fdba5eからアカウントをインポート中..."
  migration-done: "{prefix}&#91f251インポートが完了しました: &#fd8ddb{count} &#91f251件のアカウントをインポートしました。"
  migration-failed: "{prefix}&#fd5e5eインポートエラー: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> プレミアム: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, 最終ログイン: &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8コマンド: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5e不明なサブコマンド: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5e使い方: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5e使い方: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5e使い方: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5e使い方: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5e不明なインポーター: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5econfig.yml の &#fd8ddbgeneral.language&#fdba5e を変更してから &#e39fff/rlogin reload&#fdba5e を実行してください。"
  changeuuid-usage: "{prefix}&#fd5e5e使い方: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5e移動するのはパスワード、2FA、登録日だけです。インベントリ、権限、経済は移動しません（ワールドや他のプラグインのものです）。"
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251アカウントを移動しました。そのプレイヤーが接続中なら入り直す必要があります。"
  changeuuid-not-found: "{prefix}&#fd5e5eこの名前の rLogin アカウントが見つかりません: &#fd8ddb{input}&#fd5e5e"
  changeuuid-target-exists: "{prefix}&#fd5e5e移動先にはすでに rLogin アカウントがあります。先に次で削除してください: &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5e移動元と移動先が同じ UUID です。何もすることはありません。"
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid に失敗しました: &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lサーバー設定エラー\n\n&#d4d9d8このサーバーには必要なプラグインが不足しているため、誰も参加できません。\n&#fdba5e管理者に PacketEvents のインストールを伝えてください:\n&#e39fff{link}"


spawn:
  header: "{prefix}&#d4d9d8rLogin のスポーン地点:"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "未設定（プレイヤーはログアウトした場所に出ます）"
  roles-help: "&#fdba5ejoin&#d4d9d8 = 認証済みの参加  &#fdba5efirstjoin&#d4d9d8 = 初回の参加  &#fdba5elogin&#d4d9d8 = /login の直後  &#fdba5eregister&#d4d9d8 = /register の直後"
  usage: "{prefix}&#fd5e5e使い方: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5e不明なタイミング: &#fd8ddb{role}&#fd5e5e. 次のいずれかを使ってください: &#fd8ddb{roles}"
  set: "{prefix}&#91f251&#fd8ddb{role}&#91f251 のスポーンを現在地に設定しました: &#fd8ddb{location}"
  removed: "{prefix}&#91f251&#fd8ddb{role}&#91f251 のスポーンを削除しました。プレイヤーはログアウトした場所に出ます。"
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e にスポーンは設定されていませんでした。"
  teleported: "{prefix}&#91f251&#fd8ddb{role}&#91f251 のスポーンにテレポートしました: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e にスポーンが設定されていません。"
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e はワールド &#fd8ddb{world}&#fd5e5e を指していますが、読み込まれていません。プレイヤーはその場に留まります。"