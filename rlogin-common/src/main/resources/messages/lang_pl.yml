# Wiadomości rLogin — Polski
# Dostępne placeholdery zależnie od wiadomości: {player} {seconds} {attempts} {min}
#
# Formaty kolorów — można dowolnie mieszać:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Klasyczne kody: &a / §a (oraz &l, &n... dla stylów, &r do resetu)
#   3. Hex (styl BungeeCord/Spigot, domyślny w tym pliku):
#      &#RRGGBB, §x§R§R§G§G§B§B, lub samo #RRGGBB

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eTej komendy może użyć tylko gracz."

login:
  usage: "{prefix}&#fd5e5eUżycie: &#e39fff/login <hasło>"
  wrong-password: "{prefix}&#fd5e5eBłędne hasło. Pozostałe próby: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eJesteś już zalogowany."
  success: "{prefix}&#91f251Zalogowano pomyślnie. Witaj &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5ePodaj również kod 2FA: &#e39fff/login <hasło> <kod>"
  wrong-totp: "{prefix}&#fd5e5eBłędny kod 2FA."
  not-registered: "{prefix}&#fd5e5eNie masz konta. Zarejestruj się za pomocą &#e39fff/register <hasło> <hasło>"
  session-restored: "{prefix}&#91f251Witaj ponownie, {player}. Twoja sesja była nadal aktywna."
  premium-only: "&#fd5e5e&lTen serwer akceptuje tylko konta premium.\n\n&#d4d9d8Kup Minecraft na minecraft.net lub poproś właściciela o zezwolenie na konta nie-premium."

register:
  usage: "{prefix}&#fd5e5eUżycie: &#e39fff/register <hasło> <powtórz hasło>"
  already-registered: "{prefix}&#fd5e5eTo konto jest już zarejestrowane."
  passwords-dont-match: "{prefix}&#fd5e5eHasła się nie zgadzają."
  password-too-short: "{prefix}&#fd5e5eHasło musi mieć co najmniej &#fd8ddb{min}&#fd5e5e znaków."
  premium-name-protected: "{prefix}&#fd5e5eTen nick należy do konta premium. Jeśli to twój nick, połącz się za pomocą oryginalnego klienta Minecraft."
  too-many-from-ip: "{prefix}&#fd5e5eZ twojego adresu utworzono zbyt wiele kont. Spróbuj za &#fd8ddb{seconds}&#fd5e5es."
  password-too-common: "{prefix}&#fd5e5eTo hasło jest jednym z najpopularniejszych, jakie istnieją. Wybierz inne."
  password-is-name: "{prefix}&#fd5e5eTwoje hasło nie może być twoją własną nazwą."
  success: "{prefix}&#91f251Rejestracja zakończona. Witaj &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251Wylogowano."
  not-logged-in: "{prefix}&#fd5e5eNie jesteś zalogowany."

changepassword:
  usage: "{prefix}&#fd5e5eUżycie: &#e39fff/changepassword <obecne hasło> <nowe hasło>"
  success: "{prefix}&#91f251Hasło zostało pomyślnie zaktualizowane."
  wrong-password: "{prefix}&#fd5e5eObecne hasło jest nieprawidłowe."

premium:
  auto-login-message: "{prefix}&#91f251Wykryto konto premium, sesja rozpoczęta automatycznie."
  info-premium: "{prefix}&#91f251Twoje konto zostało zweryfikowane przez Mojang jako premium."
  info-cracked: "{prefix}&#fdba5eTwoje konto nie jest premium, potrzebujesz własnego hasła."

limbo:
  freeze-reminder: "{prefix}&#fdba5eMusisz się zalogować, aby móc się poruszać. Użyj &#e39fff/login&#fdba5e lub &#e39fff/register&#fdba5e."
  action-blocked: "{prefix}&#fd5e5eNie możesz tego zrobić, dopóki się nie zalogujesz."
  login-timeout: "&#fd5e5e&lZbyt długo logowałeś się."

security:
  locked-out: "{prefix}&#fd5e5eZbyt wiele nieudanych prób. Poczekaj &#5e9dfd{seconds} sekund&#fd5e5e."

totp:
  enabled: "{prefix}&#91f251Weryfikacja dwuetapowa włączona."
  disabled: "{prefix}&#91f251Weryfikacja dwuetapowa wyłączona."
  setup-secret: "{prefix}&#fdba5eTwój klucz 2FA: &#fd8ddb{secret} &#fdba5e(dodaj go do aplikacji uwierzytelniającej i potwierdź za pomocą &#e39fff/2fa confirm <kod>&#fdba5e)"
  usage: "{prefix}&#fd5e5eUżycie: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eUwierzytelnianie dwuskładnikowe jest wyłączone na tym serwerze."
  confirm-usage: "{prefix}&#fd5e5eUżycie: &#e39fff/2fa confirm <kod>"
  already-enabled: "{prefix}&#fd5e5eMasz już włączoną weryfikację dwuetapową."
  not-enabled: "{prefix}&#fd5e5eNie masz włączonej weryfikacji dwuetapowej."

admin:
  no-permission: "{prefix}&#fd5e5eNie masz uprawnień, aby to zrobić."
  reloaded: "{prefix}&#91f251Konfiguracja przeładowana."
  unregistered: "{prefix}&#91f251Konto gracza &#fd8ddb{player} &#91f251zostało usunięte."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251został zalogowany na siłę."
  player-not-found: "{prefix}&#fd5e5eNie znaleziono gracza."
  migration-started: "{prefix}&#fdba5eImportowanie kont z &#fd8ddb{plugin}&#fdba5e..."
  migration-done: "{prefix}&#91f251Import zakończony: zaimportowano &#fd8ddb{count} &#91f251kont."
  migration-failed: "{prefix}&#fd5e5eBłąd importu: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> premium: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, ostatnie logowanie: &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8Komendy: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5eNieznana podkomenda: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5eUżycie: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5eUżycie: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5eUżycie: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5eUżycie: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5eNieznany importer: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5eZmień &#fd8ddbgeneral.language&#fdba5e w config.yml i wykonaj &#e39fff/rlogin reload&#fdba5e."
  version: "{prefix}&#d4d9d8Działa rLogin &#fd8ddb{version}&#d4d9d8 (&#fd8ddb{platform}&#d4d9d8)."
  version-outdated: "{prefix}&#fdba5erLogin &#fd8ddb{latest}&#fdba5e jest dostępny: &#fd8ddb{url}&#fdba5e"
  version-latest: "{prefix}&#91f251Używasz najnowszej wersji."
  version-ahead: "{prefix}&#fdba5eUżywasz kompilacji nowszej niż ostatnia wersja (&#fd8ddb{latest}&#fdba5e)."
  version-unknown: "{prefix}&#fdba5eNie udało się sprawdzić aktualizacji."
  changeuuid-usage: "{prefix}&#fd5e5eUżycie: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5ePrzenosi tylko hasło, 2FA i datę rejestracji. Ekwipunek, uprawnienia i ekonomia zostają: należą do świata i do innych pluginów."
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251Konto przeniesione. Jeśli ten gracz jest online, musi wejść ponownie."
  changeuuid-not-found: "{prefix}&#fd5e5eNie znaleziono konta rLogin dla &#fd8ddb{input}&#fd5e5e."
  changeuuid-target-exists: "{prefix}&#fd5e5eCel ma już konto rLogin. Najpierw usuń je komendą &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5eŹródło i cel to ten sam UUID; nic do zrobienia."
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid nie powiodło się: &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lSerwer źle skonfigurowany\n\n&#d4d9d8Na tym serwerze brakuje wymaganego pluginu, więc nikt nie może wejść.\n&#fdba5ePowiedz administratorowi, żeby zainstalował PacketEvents:\n&#e39fff{link}"
  online-mode-conflict: "&#fd5e5e&lSerwer źle skonfigurowany\n\n&#d4d9d8Ten serwer ma włączony online-mode, więc gracze bez konta Minecraft w ogóle nie mogą dołączyć.\n&#fdba5ePoproś administratora o ustawienie online-mode na false."


spawn:
  header: "{prefix}&#d4d9d8Spawny rLogin:"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "nie ustawiony (gracze zostają tam, gdzie się wylogowali)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = wejście już uwierzytelnione  &#fdba5efirstjoin&#d4d9d8 = pierwsze wejście w ogóle  &#fdba5elogin&#d4d9d8 = po /login  &#fdba5eregister&#d4d9d8 = po /register"
  usage: "{prefix}&#fd5e5eUżycie: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eNieznany moment: &#fd8ddb{role}&#fd5e5e. Użyj jednego z: &#fd8ddb{roles}"
  set: "{prefix}&#91f251Spawn dla &#fd8ddb{role}&#91f251 zapisany tam, gdzie stoisz: &#fd8ddb{location}"
  removed: "{prefix}&#91f251Spawn dla &#fd8ddb{role}&#91f251 usunięty. Gracze zostają teraz tam, gdzie się wylogowali."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e nie miał ustawionego spawnu."
  teleported: "{prefix}&#91f251Teleportowano na spawn &#fd8ddb{role}&#91f251: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e nie ma ustawionego spawnu."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e wskazuje na świat &#fd8ddb{world}&#fd5e5e, który nie jest załadowany. Gracze zostaliby tam, gdzie są."

recovery:
  usage: "{prefix}&#fd5e5eUżycie: /recover <kod> <nowe hasło>"
  disabled: "{prefix}&#fdba5eOdzyskiwanie konta jest wyłączone na tym serwerze."
  already-logged-in: "{prefix}&#fdba5eJesteś już zalogowany. Użyj /changepassword."
  no-codes: "{prefix}&#fd5e5eTo konto nie ma już kodów odzyskiwania. Zwróć się do administratora."
  wrong-code: "{prefix}&#fd5e5eTen kod odzyskiwania jest nieprawidłowy."
  success: "{prefix}&#91f251Konto odzyskane. Hasło zostało zmienione, a 2FA wyłączone. Pozostało &#fd8ddb{remaining}&#91f251 kodów."
  none-left: "{prefix}&#fdba5eTo był twój ostatni kod. Poproś administratora o nowy zestaw."
  issued-header: "{prefix}&#fdba5eKody odzyskiwania - zapisz je teraz:"
  issued-entry: "&#fd8ddb  {code}"
  issued-footer: "{prefix}&#d4d9d8Nie zostaną pokazane ponownie. Każdy działa raz i pozwala ustawić nowe hasło."
