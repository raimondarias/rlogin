# rLogin messages — English
# Placeholders available depending on the message: {player} {seconds} {attempts} {min}
#
# Color formats — mix freely, all three are supported in every string:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Legacy codes: &a / §a (and &l, &n... for styles, &r to reset)
#   3. Hex (BungeeCord/Spigot style, the default used below): &#RRGGBB,
#      §x§R§R§G§G§B§B, or a bare #RRGGBB
#
# Palette this file follows:
#   commands   #e39fff   values/placeholders #fd8ddb   errors  #fd5e5e
#   success    #91f251   warnings             #fdba5e   time    #5e9dfd
#   neutral    #d4d9d8

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eOnly a player can use this command."

login:
  usage: "{prefix}&#fd5e5eUsage: &#e39fff/login <password>"
  wrong-password: "{prefix}&#fd5e5eWrong password. Attempts left: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eYou are already logged in."
  success: "{prefix}&#91f251Logged in successfully. Welcome &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5eAlso enter your 2FA code: &#e39fff/login <password> <code>"
  wrong-totp: "{prefix}&#fd5e5eWrong 2FA code."
  not-registered: "{prefix}&#fd5e5eYou don't have an account. Register with &#e39fff/register <password> <password>"
  session-restored: "{prefix}&#91f251Welcome back, {player}. Your session was still active."
  premium-only: "&#fd5e5e&lThis server only accepts premium accounts.\n\n&#d4d9d8Buy Minecraft at minecraft.net, or ask the owner to allow non-premium players."

register:
  usage: "{prefix}&#fd5e5eUsage: &#e39fff/register <password> <repeat password>"
  already-registered: "{prefix}&#fd5e5eThis account is already registered."
  passwords-dont-match: "{prefix}&#fd5e5ePasswords don't match."
  password-too-short: "{prefix}&#fd5e5ePassword must be at least &#fd8ddb{min}&#fd5e5e characters long."
  premium-name-protected: "{prefix}&#fd5e5eThat name belongs to a premium account. If it's yours, connect with the original Minecraft client."
  success: "{prefix}&#91f251Registration complete. Welcome &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251Logged out."
  not-logged-in: "{prefix}&#fd5e5eYou are not logged in."

changepassword:
  usage: "{prefix}&#fd5e5eUsage: &#e39fff/changepassword <current password> <new password>"
  success: "{prefix}&#91f251Password updated successfully."
  wrong-password: "{prefix}&#fd5e5eCurrent password is incorrect."

premium:
  auto-login-message: "{prefix}&#91f251Premium account detected, session started automatically."
  info-premium: "{prefix}&#91f251Your account is verified as premium by Mojang."
  info-cracked: "{prefix}&#fdba5eYour account is non-premium, you need your own password."

limbo:
  freeze-reminder: "{prefix}&#fdba5eYou must log in to be able to move. Use &#e39fff/login&#fdba5e or &#e39fff/register&#fdba5e."
  action-blocked: "{prefix}&#fd5e5eYou can't do that until you log in."
  login-timeout: "&#fd5e5e&lYou took too long to log in."

security:
  locked-out: "{prefix}&#fd5e5eToo many failed attempts. Wait &#5e9dfd{seconds} seconds&#fd5e5e."

totp:
  enabled: "{prefix}&#91f251Two-factor authentication enabled."
  disabled: "{prefix}&#91f251Two-factor authentication disabled."
  setup-secret: "{prefix}&#fdba5eYour 2FA key: &#fd8ddb{secret} &#fdba5e(add it to your authenticator app and confirm with &#e39fff/2fa confirm <code>&#fdba5e)"
  usage: "{prefix}&#fd5e5eUsage: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eTwo-factor authentication is disabled on this server."
  confirm-usage: "{prefix}&#fd5e5eUsage: &#e39fff/2fa confirm <code>"
  already-enabled: "{prefix}&#fd5e5eYou already have two-factor authentication enabled."
  not-enabled: "{prefix}&#fd5e5eYou don't have two-factor authentication enabled."

admin:
  no-permission: "{prefix}&#fd5e5eYou don't have permission to do that."
  reloaded: "{prefix}&#91f251Configuration reloaded."
  unregistered: "{prefix}&#fd8ddb{player}&#91f251's account has been deleted."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251has been force logged in."
  player-not-found: "{prefix}&#fd5e5ePlayer not found."
  migration-started: "{prefix}&#fdba5eImporting accounts from &#fd8ddb{plugin}&#fdba5e..."
  migration-done: "{prefix}&#91f251Import complete: &#fd8ddb{count} &#91f251accounts imported."
  migration-failed: "{prefix}&#fd5e5eImport error: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> premium: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, last login: &#5e9dfd{last-login}"

  help: "{prefix}&#d4d9d8Commands: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5eUnknown subcommand: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5eUsage: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5eUsage: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5eUsage: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5eUsage: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5eUnknown importer: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5eChange &#fd8ddbgeneral.language&#fdba5e in config.yml, then run &#e39fff/rlogin reload&#fdba5e."
  changeuuid-usage: "{prefix}&#fd5e5eUsage: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5eMoves the password, 2FA and registration date only. Inventory, permissions and economy stay behind - they belong to the world and to other plugins."
  changeuuid-resolved: "{prefix}&#d4d9d8{input} &#d4d9d8-> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251Account moved. If that player is connected, they need to rejoin."
  changeuuid-not-found: "{prefix}&#fd5e5eNo rLogin account found for &#fd8ddb{input}&#fd5e5e."
  changeuuid-target-exists: "{prefix}&#fd5e5eThe target already has an rLogin account. Delete it first with &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5eSource and target are the same UUID; nothing to do."
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid failed: &#fd8ddb{error}"

spawn:
  # {role} is one of: join, firstjoin, login, register
  header: "{prefix}&#d4d9d8rLogin spawns:"
  entry: "&#d4d9d8  {role} &#d4d9d8- &#fd8ddb{location}"
  not-set: "not set (players stay where they logged out)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = already-authenticated join  &#fdba5efirstjoin&#d4d9d8 = very first join ever  &#fdba5elogin&#d4d9d8 = after /login  &#fdba5eregister&#d4d9d8 = after /register"
  usage: "{prefix}&#fd5e5eUsage: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e or &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eUnknown moment: &#fd8ddb{role}&#fd5e5e. Use one of: &#fd8ddb{roles}"
  set: "{prefix}&#91f251Spawn for &#fd8ddb{role}&#91f251 set where you are standing: &#fd8ddb{location}"
  removed: "{prefix}&#91f251Spawn for &#fd8ddb{role}&#91f251 removed. Players are now left where they logged out."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e had no spawn set."
  teleported: "{prefix}&#91f251Teleported to the &#fd8ddb{role}&#91f251 spawn: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e has no spawn set."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e points at world &#fd8ddb{world}&#fd5e5e, which isn't loaded. Players would stay where they are."

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lServer misconfigured\n\n&#d4d9d8This server is missing a required plugin, so nobody can connect.\n&#fdba5eTell an administrator to install PacketEvents:\n&#e39fff{link}"
  online-mode-conflict: "&#fd5e5e&lServer misconfigured\n\n&#d4d9d8This server has online-mode enabled, so players without a Minecraft account cannot connect at all.\n&#fdba5eTell an administrator to set online-mode to false."
