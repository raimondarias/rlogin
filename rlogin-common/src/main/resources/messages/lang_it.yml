# Messaggi rLogin — Italiano
# Placeholder disponibili a seconda del messaggio: {player} {seconds} {attempts} {min}
#
# Formati colore — combinabili liberamente:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Codici classici: &a / §a (e &l, &n... per gli stili, &r per il reset)
#   3. Hex (stile BungeeCord/Spigot, predefinito in questo file):
#      &#RRGGBB, §x§R§R§G§G§B§B, oppure un #RRGGBB semplice

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eSolo un giocatore può usare questo comando."

login:
  usage: "{prefix}&#fd5e5eUso: &#e39fff/login <password>"
  wrong-password: "{prefix}&#fd5e5ePassword errata. Tentativi rimasti: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eHai già effettuato l'accesso."
  success: "{prefix}&#91f251Accesso effettuato con successo. Benvenuto &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5eInserisci anche il tuo codice 2FA: &#e39fff/login <password> <codice>"
  wrong-totp: "{prefix}&#fd5e5eCodice 2FA errato."
  not-registered: "{prefix}&#fd5e5eNon hai un account. Registrati con &#e39fff/register <password> <password>"
  session-restored: "{prefix}&#91f251Bentornato, {player}. La tua sessione era ancora attiva."
  premium-only: "&#fd5e5e&lQuesto server accetta solo account premium.\n\n&#d4d9d8Compra Minecraft su minecraft.net, o chiedi al proprietario di permettere account non premium."

register:
  usage: "{prefix}&#fd5e5eUso: &#e39fff/register <password> <ripeti password>"
  already-registered: "{prefix}&#fd5e5eQuesto account è già registrato."
  passwords-dont-match: "{prefix}&#fd5e5eLe password non coincidono."
  password-too-short: "{prefix}&#fd5e5eLa password deve contenere almeno &#fd8ddb{min}&#fd5e5e caratteri."
  premium-name-protected: "{prefix}&#fd5e5eQuesto nome appartiene a un account premium. Se è tuo, connettiti con il client Minecraft originale."
  too-many-from-ip: "{prefix}&#fd5e5eTroppi account creati dal tuo indirizzo. Riprova tra &#fd8ddb{seconds}&#fd5e5es."
  password-too-common: "{prefix}&#fd5e5eQuella password è tra le più comuni che esistano. Scegline un'altra."
  password-is-name: "{prefix}&#fd5e5eLa tua password non può essere il tuo stesso nome."
  success: "{prefix}&#91f251Registrazione completata. Benvenuto &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251Disconnesso."
  not-logged-in: "{prefix}&#fd5e5eNon hai effettuato l'accesso."

changepassword:
  usage: "{prefix}&#fd5e5eUso: &#e39fff/changepassword <password attuale> <nuova password>"
  success: "{prefix}&#91f251Password aggiornata con successo."
  wrong-password: "{prefix}&#fd5e5eLa password attuale non è corretta."

premium:
  auto-login-message: "{prefix}&#91f251Account premium rilevato, sessione avviata automaticamente."
  info-premium: "{prefix}&#91f251Il tuo account è verificato come premium da Mojang."
  info-cracked: "{prefix}&#fdba5eIl tuo account non è premium, hai bisogno di una password tua."

limbo:
  freeze-reminder: "{prefix}&#fdba5eDevi effettuare l'accesso per poterti muovere. Usa &#e39fff/login&#fdba5e o &#e39fff/register&#fdba5e."
  action-blocked: "{prefix}&#fd5e5eNon puoi farlo finché non effettui l'accesso."
  login-timeout: "&#fd5e5e&lHai impiegato troppo tempo per accedere."

security:
  locked-out: "{prefix}&#fd5e5eTroppi tentativi falliti. Attendi &#5e9dfd{seconds} secondi&#fd5e5e."
  new-device-warning: "{prefix}&#fdba5eQuesto account ha appena effettuato l'accesso da &#fd8ddb{ip}&#fdba5e, un indirizzo mai usato prima. Se non sei stato tu, cambia la password con &#e39fff/changepassword&#fdba5e e attiva la 2FA con &#e39fff/2fa enable&#fdba5e."

totp:
  enabled: "{prefix}&#91f251Autenticazione a due fattori attivata."
  disabled: "{prefix}&#91f251Autenticazione a due fattori disattivata."
  setup-secret: "{prefix}&#fdba5eLa tua chiave 2FA: &#fd8ddb{secret} &#fdba5e(aggiungila alla tua app di autenticazione e conferma con &#e39fff/2fa confirm <codice>&#fdba5e)"
  usage: "{prefix}&#fd5e5eUso: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eL'autenticazione a due fattori è disattivata su questo server."
  confirm-usage: "{prefix}&#fd5e5eUso: &#e39fff/2fa confirm <codice>"
  already-enabled: "{prefix}&#fd5e5eHai già attivato l'autenticazione a due fattori."
  not-enabled: "{prefix}&#fd5e5eNon hai attivato l'autenticazione a due fattori."

admin:
  no-permission: "{prefix}&#fd5e5eNon hai il permesso di farlo."
  reloaded: "{prefix}&#91f251Configurazione ricaricata."
  unregistered: "{prefix}&#91f251L'account di &#fd8ddb{player} &#91f251è stato eliminato."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251è stato autenticato forzatamente."
  player-not-found: "{prefix}&#fd5e5eGiocatore non trovato."
  migration-started: "{prefix}&#fdba5eImportazione account da &#fd8ddb{plugin}&#fdba5e..."
  migration-done: "{prefix}&#91f251Importazione completata: &#fd8ddb{count} &#91f251account importati."
  migration-failed: "{prefix}&#fd5e5eErrore di importazione: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> premium: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, ultimo accesso: &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8Comandi: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5eSottocomando sconosciuto: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5eUso: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5eUso: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5eUso: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5eUso: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5eImportatore sconosciuto: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5eCambia &#fd8ddbgeneral.language&#fdba5e in config.yml ed esegui &#e39fff/rlogin reload&#fdba5e."
  version: "{prefix}&#d4d9d8rLogin &#fd8ddb{version}&#d4d9d8 in esecuzione (&#fd8ddb{platform}&#d4d9d8)."
  version-outdated: "{prefix}&#fdba5erLogin &#fd8ddb{latest}&#fdba5e è disponibile: &#fd8ddb{url}&#fdba5e"
  version-latest: "{prefix}&#91f251Stai usando l'ultima versione pubblicata."
  version-ahead: "{prefix}&#fdba5eStai usando una build più recente dell'ultima versione (&#fd8ddb{latest}&#fdba5e)."
  version-unknown: "{prefix}&#fdba5eImpossibile controllare gli aggiornamenti."
  changeuuid-usage: "{prefix}&#fd5e5eUso: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5eSposta la password, la 2FA e la data di registrazione. Con LuckPerms installato viene anche il rank; inventario ed economia restano - appartengono al mondo e ad altri plugin."
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251Account spostato. Se quel giocatore è connesso, deve rientrare."
  changeuuid-perms-moved: "{prefix}&#91f251Anche il rank LuckPerms è stato trasferito."
  changeuuid-perms-target-not-empty: "{prefix}&#fdba5eLuckPerms non è stato toccato: il nuovo UUID ha già permessi propri."
  changeuuid-perms-failed: "{prefix}&#fd5e5eImpossibile copiare il rank LuckPerms. Guarda la console."
  changeuuid-not-found: "{prefix}&#fd5e5eNessun account rLogin trovato per &#fd8ddb{input}&#fd5e5e."
  changeuuid-target-exists: "{prefix}&#fd5e5eLa destinazione ha già un account rLogin. Eliminalo prima con &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5eOrigine e destinazione sono lo stesso UUID; niente da fare."
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid non riuscito: &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lServer configurato male\n\n&#d4d9d8A questo server manca un plugin necessario, quindi nessuno può entrare.\n&#fdba5eAvvisa un amministratore di installare PacketEvents:\n&#e39fff{link}"
  online-mode-conflict: "&#fd5e5e&lServer configurato male\n\n&#d4d9d8Questo server ha online-mode attivo, quindi i giocatori senza account Minecraft non possono entrare.\n&#fdba5eChiedi a un amministratore di impostare online-mode su false."


spawn:
  header: "{prefix}&#d4d9d8Spawn di rLogin:"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "non impostato (i giocatori restano dove sono usciti)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = ingresso già autenticato  &#fdba5efirstjoin&#d4d9d8 = primissimo ingresso  &#fdba5elogin&#d4d9d8 = dopo /login  &#fdba5eregister&#d4d9d8 = dopo /register"
  usage: "{prefix}&#fd5e5eUso: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eMomento sconosciuto: &#fd8ddb{role}&#fd5e5e. Usane uno tra: &#fd8ddb{roles}"
  set: "{prefix}&#91f251Spawn di &#fd8ddb{role}&#91f251 salvato dove ti trovi: &#fd8ddb{location}"
  removed: "{prefix}&#91f251Spawn di &#fd8ddb{role}&#91f251 rimosso. Ora i giocatori restano dove sono usciti."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e non aveva uno spawn impostato."
  teleported: "{prefix}&#91f251Teletrasportato allo spawn di &#fd8ddb{role}&#91f251: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e non ha uno spawn impostato."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e punta al mondo &#fd8ddb{world}&#fd5e5e, che non è caricato. I giocatori resterebbero dove sono."

recovery:
  usage: "{prefix}&#fd5e5eUso: /recover <codice> <nuova password>"
  disabled: "{prefix}&#fdba5eIl recupero degli account è disattivato su questo server."
  already-logged-in: "{prefix}&#fdba5eHai già effettuato l'accesso. Usa /changepassword."
  no-codes: "{prefix}&#fd5e5eQuesto account non ha più codici di recupero. Parla con un amministratore."
  wrong-code: "{prefix}&#fd5e5eQuel codice di recupero non è valido."
  success: "{prefix}&#91f251Account recuperato. La password è stata cambiata e la 2FA disattivata. Restano &#fd8ddb{remaining}&#91f251 codici."
  none-left: "{prefix}&#fdba5eEra il tuo ultimo codice. Chiedi a un amministratore una nuova serie."
  issued-header: "{prefix}&#fdba5eCodici di recupero - segnateli adesso:"
  issued-entry: "&#fd8ddb  {code}"
  issued-footer: "{prefix}&#d4d9d8Non ti verranno mostrati di nuovo. Ognuno vale una volta e ti permette di impostare una nuova password."
