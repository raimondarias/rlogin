# Messages rLogin — Français
# Placeholders disponibles selon le message : {player} {seconds} {attempts} {min}
#
# Formats de couleur — mélangeables librement :
#   1. MiniMessage (Kyori) : <red>, <#e39fff>, <bold>...
#   2. Codes classiques : &a / §a (et &l, &n... pour les styles, &r pour réinitialiser)
#   3. Hex (style BungeeCord/Spigot, utilisé par défaut ici) :
#      &#RRGGBB, §x§R§R§G§G§B§B, ou un simple #RRGGBB

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eSeul un joueur peut utiliser cette commande."

login:
  usage: "{prefix}&#fd5e5eUtilisation : &#e39fff/login <mot de passe>"
  wrong-password: "{prefix}&#fd5e5eMot de passe incorrect. Tentatives restantes : &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eTu es déjà connecté."
  success: "{prefix}&#91f251Connexion réussie. Bienvenue &#fd8ddb{player}&#91f251 !"
  need-totp: "{prefix}&#fdba5eEntre aussi ton code 2FA : &#e39fff/login <mot de passe> <code>"
  wrong-totp: "{prefix}&#fd5e5eCode 2FA incorrect."
  not-registered: "{prefix}&#fd5e5eTu n'as pas de compte. Inscris-toi avec &#e39fff/register <mot de passe> <mot de passe>"
  session-restored: "{prefix}&#91f251Bon retour, {player}. Ta session était toujours active."
  premium-only: "&#fd5e5e&lCe serveur n'accepte que les comptes premium.\n\n&#d4d9d8Achète Minecraft sur minecraft.net, ou demande au propriétaire d'autoriser les comptes non premium."

register:
  usage: "{prefix}&#fd5e5eUtilisation : &#e39fff/register <mot de passe> <répéter le mot de passe>"
  already-registered: "{prefix}&#fd5e5eCe compte est déjà enregistré."
  passwords-dont-match: "{prefix}&#fd5e5eLes mots de passe ne correspondent pas."
  password-too-short: "{prefix}&#fd5e5eLe mot de passe doit contenir au moins &#fd8ddb{min}&#fd5e5e caractères."
  premium-name-protected: "{prefix}&#fd5e5eCe nom appartient à un compte premium. Si c'est le tien, connecte-toi avec le client Minecraft original."
  too-many-from-ip: "{prefix}&#fd5e5eTrop de comptes ont été créés depuis ton adresse. Réessaie dans &#fd8ddb{seconds}&#fd5e5es."
  password-too-common: "{prefix}&#fd5e5eCe mot de passe est l'un des plus courants qui soient. Choisis-en un autre."
  password-is-name: "{prefix}&#fd5e5eTon mot de passe ne peut pas être ton propre pseudo."
  success: "{prefix}&#91f251Inscription terminée. Bienvenue &#fd8ddb{player}&#91f251 !"

logout:
  success: "{prefix}&#91f251Déconnecté."
  not-logged-in: "{prefix}&#fd5e5eTu n'es pas connecté."

changepassword:
  usage: "{prefix}&#fd5e5eUtilisation : &#e39fff/changepassword <mot de passe actuel> <nouveau mot de passe>"
  success: "{prefix}&#91f251Mot de passe mis à jour avec succès."
  wrong-password: "{prefix}&#fd5e5eLe mot de passe actuel est incorrect."

premium:
  auto-login-message: "{prefix}&#91f251Compte premium détecté, session démarrée automatiquement."
  info-premium: "{prefix}&#91f251Ton compte est vérifié comme premium par Mojang."
  info-cracked: "{prefix}&#fdba5eTon compte n'est pas premium, tu as besoin de ton propre mot de passe."

limbo:
  freeze-reminder: "{prefix}&#fdba5eTu dois te connecter pour pouvoir bouger. Utilise &#e39fff/login&#fdba5e ou &#e39fff/register&#fdba5e."
  action-blocked: "{prefix}&#fd5e5eTu ne peux pas faire ça avant de te connecter."
  login-timeout: "&#fd5e5e&lTu as mis trop de temps à te connecter."

security:
  locked-out: "{prefix}&#fd5e5eTrop de tentatives échouées. Attends &#5e9dfd{seconds} secondes&#fd5e5e."

totp:
  enabled: "{prefix}&#91f251Authentification à deux facteurs activée."
  disabled: "{prefix}&#91f251Authentification à deux facteurs désactivée."
  setup-secret: "{prefix}&#fdba5eTa clé 2FA : &#fd8ddb{secret} &#fdba5e(ajoute-la à ton application d'authentification et confirme avec &#e39fff/2fa confirm <code>&#fdba5e)"
  usage: "{prefix}&#fd5e5eUtilisation: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eL'authentification à deux facteurs est désactivée sur ce serveur."
  confirm-usage: "{prefix}&#fd5e5eUtilisation : &#e39fff/2fa confirm <code>"
  already-enabled: "{prefix}&#fd5e5eTu as déjà activé l'authentification à deux facteurs."
  not-enabled: "{prefix}&#fd5e5eTu n'as pas activé l'authentification à deux facteurs."

admin:
  no-permission: "{prefix}&#fd5e5eTu n'as pas la permission de faire ça."
  reloaded: "{prefix}&#91f251Configuration rechargée."
  unregistered: "{prefix}&#91f251Le compte de &#fd8ddb{player} &#91f251a été supprimé."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251a été connecté de force."
  player-not-found: "{prefix}&#fd5e5eJoueur introuvable."
  migration-started: "{prefix}&#fdba5eImportation des comptes depuis &#fd8ddb{plugin}&#fdba5e..."
  migration-done: "{prefix}&#91f251Importation terminée : &#fd8ddb{count} &#91f251comptes importés."
  migration-failed: "{prefix}&#fd5e5eErreur d'importation : &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> premium : &#fd8ddb{premium}&#d4d9d8, 2FA : &#fd8ddb{totp}&#d4d9d8, dernière connexion : &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8Commandes: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5eSous-commande inconnue: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5eUtilisation: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5eUtilisation: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5eUtilisation: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5eUtilisation: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5eImportateur inconnu: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5eChange &#fd8ddbgeneral.language&#fdba5e dans config.yml puis lance &#e39fff/rlogin reload&#fdba5e."
  changeuuid-usage: "{prefix}&#fd5e5eUtilisation: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5eDéplace seulement le mot de passe, la 2FA et la date d'inscription. L'inventaire, les permissions et l'économie restent : ils appartiennent au monde et aux autres plugins."
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251Compte déplacé. Si ce joueur est connecté, il doit se reconnecter."
  changeuuid-not-found: "{prefix}&#fd5e5eAucun compte rLogin trouvé pour &#fd8ddb{input}&#fd5e5e."
  changeuuid-target-exists: "{prefix}&#fd5e5eLa cible a déjà un compte rLogin. Supprime-le d'abord avec &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5eSource et cible sont le même UUID ; rien à faire."
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid a échoué : &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lServeur mal configuré\n\n&#d4d9d8Il manque un plugin requis sur ce serveur, personne ne peut donc se connecter.\n&#fdba5ePréviens un administrateur d'installer PacketEvents :\n&#e39fff{link}"
  online-mode-conflict: "&#fd5e5e&lServeur mal configuré\n\n&#d4d9d8Ce serveur a online-mode activé, donc les joueurs sans compte Minecraft ne peuvent pas se connecter.\n&#fdba5eDemande à un administrateur de mettre online-mode sur false."


spawn:
  header: "{prefix}&#d4d9d8Spawns rLogin :"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "non défini (les joueurs restent où ils se sont déconnectés)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = connexion déjà authentifiée  &#fdba5efirstjoin&#d4d9d8 = toute première connexion  &#fdba5elogin&#d4d9d8 = après /login  &#fdba5eregister&#d4d9d8 = après /register"
  usage: "{prefix}&#fd5e5eUtilisation: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eMoment inconnu: &#fd8ddb{role}&#fd5e5e. Utilise l'un de : &#fd8ddb{roles}"
  set: "{prefix}&#91f251Spawn de &#fd8ddb{role}&#91f251 enregistré là où tu te trouves : &#fd8ddb{location}"
  removed: "{prefix}&#91f251Spawn de &#fd8ddb{role}&#91f251 supprimé. Les joueurs restent maintenant où ils se sont déconnectés."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e n'avait pas de spawn défini."
  teleported: "{prefix}&#91f251Téléporté au spawn de &#fd8ddb{role}&#91f251 : &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e n'a pas de spawn défini."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e pointe vers le monde &#fd8ddb{world}&#fd5e5e, qui n'est pas chargé. Les joueurs resteraient où ils sont."

recovery:
  usage: "{prefix}&#fd5e5eUtilisation : /recover <code> <nouveau mot de passe>"
  disabled: "{prefix}&#fdba5eLa récupération de compte est désactivée sur ce serveur."
  already-logged-in: "{prefix}&#fdba5eTu es déjà connecté. Utilise /changepassword."
  no-codes: "{prefix}&#fd5e5eCe compte n'a plus de codes de récupération. Contacte un administrateur."
  wrong-code: "{prefix}&#fd5e5eCe code de récupération n'est pas valide."
  success: "{prefix}&#91f251Compte récupéré. Ton mot de passe a été changé et la 2FA désactivée. Il reste &#fd8ddb{remaining}&#91f251 codes."
  none-left: "{prefix}&#fdba5eC'était ton dernier code. Demande-en une nouvelle série à un administrateur."
  issued-header: "{prefix}&#fdba5eCodes de récupération - note-les maintenant :"
  issued-entry: "&#fd8ddb  {code}"
  issued-footer: "{prefix}&#d4d9d8Ils ne te seront plus montrés. Chacun fonctionne une fois et permet de définir un nouveau mot de passe."
