# rLogin berichten — Nederlands
# Beschikbare placeholders afhankelijk van het bericht: {player} {seconds} {attempts} {min}
#
# Kleurformaten — vrij te combineren:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Klassieke codes: &a / §a (en &l, &n... voor stijlen, &r om te resetten)
#   3. Hex (BungeeCord/Spigot-stijl, standaard gebruikt in dit bestand):
#      &#RRGGBB, §x§R§R§G§G§B§B, of een losse #RRGGBB

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eAlleen een speler kan dit commando gebruiken."

login:
  usage: "{prefix}&#fd5e5eGebruik: &#e39fff/login <wachtwoord>"
  wrong-password: "{prefix}&#fd5e5eVerkeerd wachtwoord. Resterende pogingen: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eJe bent al ingelogd."
  success: "{prefix}&#91f251Succesvol ingelogd. Welkom &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5eVoer ook je 2FA-code in: &#e39fff/login <wachtwoord> <code>"
  wrong-totp: "{prefix}&#fd5e5eVerkeerde 2FA-code."
  not-registered: "{prefix}&#fd5e5eJe hebt geen account. Registreer met &#e39fff/register <wachtwoord> <wachtwoord>"
  session-restored: "{prefix}&#91f251Welkom terug, {player}. Je sessie was nog actief."
  premium-only: "&#fd5e5e&lDeze server accepteert alleen premium-accounts.\n\n&#d4d9d8Koop Minecraft op minecraft.net, of vraag de eigenaar om niet-premium accounts toe te staan."

register:
  usage: "{prefix}&#fd5e5eGebruik: &#e39fff/register <wachtwoord> <herhaal wachtwoord>"
  already-registered: "{prefix}&#fd5e5eDit account is al geregistreerd."
  passwords-dont-match: "{prefix}&#fd5e5eWachtwoorden komen niet overeen."
  password-too-short: "{prefix}&#fd5e5eWachtwoord moet minstens &#fd8ddb{min}&#fd5e5e tekens lang zijn."
  premium-name-protected: "{prefix}&#fd5e5eDeze naam behoort tot een premium account. Als het jouw naam is, verbind dan met de originele Minecraft-client."
  too-many-from-ip: "{prefix}&#fd5e5eEr zijn te veel accounts aangemaakt vanaf jouw adres. Probeer het over &#fd8ddb{seconds}&#fd5e5es opnieuw."
  password-too-common: "{prefix}&#fd5e5eDat wachtwoord is een van de meest voorkomende die er zijn. Kies een ander."
  password-is-name: "{prefix}&#fd5e5eJe wachtwoord mag niet je eigen naam zijn."
  success: "{prefix}&#91f251Registratie voltooid. Welkom &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251Uitgelogd."
  not-logged-in: "{prefix}&#fd5e5eJe bent niet ingelogd."

changepassword:
  usage: "{prefix}&#fd5e5eGebruik: &#e39fff/changepassword <huidig wachtwoord> <nieuw wachtwoord>"
  success: "{prefix}&#91f251Wachtwoord succesvol bijgewerkt."
  wrong-password: "{prefix}&#fd5e5eHet huidige wachtwoord is onjuist."

premium:
  auto-login-message: "{prefix}&#91f251Premium account gedetecteerd, sessie automatisch gestart."
  info-premium: "{prefix}&#91f251Je account is door Mojang geverifieerd als premium."
  info-cracked: "{prefix}&#fdba5eJe account is niet premium, je hebt je eigen wachtwoord nodig."

limbo:
  freeze-reminder: "{prefix}&#fdba5eJe moet inloggen om te kunnen bewegen. Gebruik &#e39fff/login&#fdba5e of &#e39fff/register&#fdba5e."
  action-blocked: "{prefix}&#fd5e5eDat kun je niet doen totdat je bent ingelogd."
  login-timeout: "&#fd5e5e&lJe deed er te lang over om in te loggen."

security:
  locked-out: "{prefix}&#fd5e5eTe veel mislukte pogingen. Wacht &#5e9dfd{seconds} seconden&#fd5e5e."

totp:
  enabled: "{prefix}&#91f251Tweefactorauthenticatie ingeschakeld."
  disabled: "{prefix}&#91f251Tweefactorauthenticatie uitgeschakeld."
  setup-secret: "{prefix}&#fdba5eJe 2FA-sleutel: &#fd8ddb{secret} &#fdba5e(voeg deze toe aan je authenticator-app en bevestig met &#e39fff/2fa confirm <code>&#fdba5e)"
  usage: "{prefix}&#fd5e5eGebruik: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eTweefactorauthenticatie is uitgeschakeld op deze server."
  confirm-usage: "{prefix}&#fd5e5eGebruik: &#e39fff/2fa confirm <code>"
  already-enabled: "{prefix}&#fd5e5eJe hebt tweefactorauthenticatie al ingeschakeld."
  not-enabled: "{prefix}&#fd5e5eJe hebt tweefactorauthenticatie niet ingeschakeld."

admin:
  no-permission: "{prefix}&#fd5e5eJe hebt geen toestemming om dat te doen."
  reloaded: "{prefix}&#91f251Configuratie opnieuw geladen."
  unregistered: "{prefix}&#91f251Het account van &#fd8ddb{player} &#91f251is verwijderd."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251is geforceerd ingelogd."
  player-not-found: "{prefix}&#fd5e5eSpeler niet gevonden."
  migration-started: "{prefix}&#fdba5eAccounts importeren vanuit &#fd8ddb{plugin}&#fdba5e..."
  migration-done: "{prefix}&#91f251Import voltooid: &#fd8ddb{count} &#91f251accounts geïmporteerd."
  migration-failed: "{prefix}&#fd5e5eImportfout: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> premium: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, laatste login: &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8Commando's: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5eOnbekend subcommando: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5eGebruik: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5eGebruik: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5eGebruik: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5eGebruik: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5eOnbekende importer: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5eWijzig &#fd8ddbgeneral.language&#fdba5e in config.yml en voer &#e39fff/rlogin reload&#fdba5e uit."
  version: "{prefix}&#d4d9d8rLogin &#fd8ddb{version}&#d4d9d8 draait (&#fd8ddb{platform}&#d4d9d8)."
  version-outdated: "{prefix}&#fdba5erLogin &#fd8ddb{latest}&#fdba5e is beschikbaar: &#fd8ddb{url}&#fdba5e"
  version-latest: "{prefix}&#91f251Je draait de nieuwste release."
  version-ahead: "{prefix}&#fdba5eJe draait een build die nieuwer is dan de nieuwste release (&#fd8ddb{latest}&#fdba5e)."
  version-unknown: "{prefix}&#fdba5eKon niet controleren op updates."
  changeuuid-usage: "{prefix}&#fd5e5eGebruik: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5eVerplaatst het wachtwoord, 2FA en de registratiedatum. Met LuckPerms geïnstalleerd gaat de rang mee; inventaris en economie blijven - die horen bij de wereld en andere plugins."
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251Account verplaatst. Als die speler online is, moet hij opnieuw verbinden."
  changeuuid-perms-moved: "{prefix}&#91f251De LuckPerms-rang is ook meegegaan."
  changeuuid-perms-target-not-empty: "{prefix}&#fdba5eLuckPerms is niet aangeraakt: de nieuwe UUID heeft al eigen rechten."
  changeuuid-perms-failed: "{prefix}&#fd5e5eKon de LuckPerms-rang niet kopiëren. Zie de console."
  changeuuid-not-found: "{prefix}&#fd5e5eGeen rLogin-account gevonden voor &#fd8ddb{input}&#fd5e5e."
  changeuuid-target-exists: "{prefix}&#fd5e5eHet doel heeft al een rLogin-account. Verwijder dat eerst met &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5eBron en doel zijn dezelfde UUID; niets te doen."
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid mislukt: &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lServer verkeerd ingesteld\n\n&#d4d9d8Op deze server ontbreekt een vereiste plugin, dus niemand kan verbinden.\n&#fdba5eZeg tegen een beheerder dat hij PacketEvents installeert:\n&#e39fff{link}"
  online-mode-conflict: "&#fd5e5e&lServer verkeerd ingesteld\n\n&#d4d9d8Deze server heeft online-mode aanstaan, dus spelers zonder Minecraft-account kunnen niet verbinden.\n&#fdba5eVraag een beheerder om online-mode op false te zetten."


spawn:
  header: "{prefix}&#d4d9d8rLogin-spawns:"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "niet ingesteld (spelers blijven waar ze uitlogden)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = al geverifieerde join  &#fdba5efirstjoin&#d4d9d8 = allereerste join  &#fdba5elogin&#d4d9d8 = na /login  &#fdba5eregister&#d4d9d8 = na /register"
  usage: "{prefix}&#fd5e5eGebruik: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eOnbekend moment: &#fd8ddb{role}&#fd5e5e. Gebruik een van: &#fd8ddb{roles}"
  set: "{prefix}&#91f251Spawn voor &#fd8ddb{role}&#91f251 opgeslagen waar je staat: &#fd8ddb{location}"
  removed: "{prefix}&#91f251Spawn voor &#fd8ddb{role}&#91f251 verwijderd. Spelers blijven nu waar ze uitlogden."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e had geen spawn ingesteld."
  teleported: "{prefix}&#91f251Geteleporteerd naar de &#fd8ddb{role}&#91f251-spawn: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e heeft geen spawn ingesteld."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e wijst naar wereld &#fd8ddb{world}&#fd5e5e, die niet geladen is. Spelers zouden blijven waar ze zijn."

recovery:
  usage: "{prefix}&#fd5e5eGebruik: /recover <code> <nieuw wachtwoord>"
  disabled: "{prefix}&#fdba5eAccountherstel staat uit op deze server."
  already-logged-in: "{prefix}&#fdba5eJe bent al ingelogd. Gebruik /changepassword."
  no-codes: "{prefix}&#fd5e5eDit account heeft geen herstelcodes meer. Vraag een beheerder."
  wrong-code: "{prefix}&#fd5e5eDie herstelcode is niet geldig."
  success: "{prefix}&#91f251Account hersteld. Je wachtwoord is gewijzigd en 2FA is uitgezet. Nog &#fd8ddb{remaining}&#91f251 codes over."
  none-left: "{prefix}&#fdba5eDat was je laatste code. Vraag een beheerder om een nieuwe set."
  issued-header: "{prefix}&#fdba5eHerstelcodes - schrijf ze nu op:"
  issued-entry: "&#fd8ddb  {code}"
  issued-footer: "{prefix}&#d4d9d8Je krijgt ze niet nog een keer te zien. Elke code werkt één keer en laat je een nieuw wachtwoord instellen."
