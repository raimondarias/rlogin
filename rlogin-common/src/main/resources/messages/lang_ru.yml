# Сообщения rLogin — Русский
# Доступные плейсхолдеры зависят от сообщения: {player} {seconds} {attempts} {min}
#
# Форматы цвета — можно свободно комбинировать:
#   1. MiniMessage (Kyori): <red>, <#e39fff>, <bold>...
#   2. Классические коды: &a / §a (и &l, &n... для стилей, &r для сброса)
#   3. Hex (в стиле BungeeCord/Spigot, используется здесь по умолчанию):
#      &#RRGGBB, §x§R§R§G§G§B§B, или просто #RRGGBB

prefix: "&#d4d9d8[&#e39fffrLogin&#d4d9d8] &r"

general:
  player-only: "{prefix}&#fd5e5eЭту команду может использовать только игрок."

login:
  usage: "{prefix}&#fd5e5eИспользование: &#e39fff/login <пароль>"
  wrong-password: "{prefix}&#fd5e5eНеверный пароль. Осталось попыток: &#fd8ddb{attempts}"
  already-logged-in: "{prefix}&#fd5e5eВы уже авторизованы."
  success: "{prefix}&#91f251Вход выполнен успешно. Добро пожаловать, &#fd8ddb{player}&#91f251!"
  need-totp: "{prefix}&#fdba5eТакже введите код 2FA: &#e39fff/login <пароль> <код>"
  wrong-totp: "{prefix}&#fd5e5eНеверный код 2FA."
  not-registered: "{prefix}&#fd5e5eУ вас нет аккаунта. Зарегистрируйтесь через &#e39fff/register <пароль> <пароль>"
  session-restored: "{prefix}&#91f251С возвращением, {player}. Ваша сессия ещё активна."
  premium-only: "&#fd5e5e&lЭтот сервер принимает только лицензионные аккаунты.\n\n&#d4d9d8Купите Minecraft на minecraft.net или попросите владельца разрешить нелицензионные аккаунты."

register:
  usage: "{prefix}&#fd5e5eИспользование: &#e39fff/register <пароль> <повторите пароль>"
  already-registered: "{prefix}&#fd5e5eЭтот аккаунт уже зарегистрирован."
  passwords-dont-match: "{prefix}&#fd5e5eПароли не совпадают."
  password-too-short: "{prefix}&#fd5e5eПароль должен содержать не менее &#fd8ddb{min}&#fd5e5e символов."
  premium-name-protected: "{prefix}&#fd5e5eЭто имя принадлежит премиум-аккаунту. Если это ваш ник, подключитесь через оригинальный клиент Minecraft."
  too-many-from-ip: "{prefix}&#fd5e5eС вашего адреса создано слишком много аккаунтов. Попробуйте через &#fd8ddb{seconds}&#fd5e5eс."
  password-too-common: "{prefix}&#fd5e5eЭтот пароль — один из самых распространённых. Выберите другой."
  password-is-name: "{prefix}&#fd5e5eПароль не может совпадать с вашим ником."
  success: "{prefix}&#91f251Регистрация завершена. Добро пожаловать, &#fd8ddb{player}&#91f251!"

logout:
  success: "{prefix}&#91f251Вы вышли из аккаунта."
  not-logged-in: "{prefix}&#fd5e5eВы не авторизованы."

changepassword:
  usage: "{prefix}&#fd5e5eИспользование: &#e39fff/changepassword <текущий пароль> <новый пароль>"
  success: "{prefix}&#91f251Пароль успешно изменён."
  wrong-password: "{prefix}&#fd5e5eТекущий пароль неверен."

premium:
  auto-login-message: "{prefix}&#91f251Обнаружен премиум-аккаунт, сессия начата автоматически."
  info-premium: "{prefix}&#91f251Ваш аккаунт подтверждён Mojang как премиум."
  info-cracked: "{prefix}&#fdba5eВаш аккаунт не премиум, вам нужен собственный пароль."

limbo:
  freeze-reminder: "{prefix}&#fdba5eВам нужно войти, чтобы двигаться. Используйте &#e39fff/login&#fdba5e или &#e39fff/register&#fdba5e."
  action-blocked: "{prefix}&#fd5e5eВы не можете сделать это, пока не войдёте в аккаунт."
  login-timeout: "&#fd5e5e&lВы слишком долго входили в игру."

security:
  locked-out: "{prefix}&#fd5e5eСлишком много неудачных попыток. Подождите &#5e9dfd{seconds} секунд&#fd5e5e."

totp:
  enabled: "{prefix}&#91f251Двухфакторная аутентификация включена."
  disabled: "{prefix}&#91f251Двухфакторная аутентификация отключена."
  setup-secret: "{prefix}&#fdba5eВаш ключ 2FA: &#fd8ddb{secret} &#fdba5e(добавьте его в приложение-аутентификатор и подтвердите через &#e39fff/2fa confirm <код>&#fdba5e)"
  usage: "{prefix}&#fd5e5eИспользование: &#e39fff/2fa <enable|disable|confirm> [code]"
  server-disabled: "{prefix}&#fdba5eДвухфакторная аутентификация отключена на этом сервере."
  confirm-usage: "{prefix}&#fd5e5eИспользование: &#e39fff/2fa confirm <код>"
  already-enabled: "{prefix}&#fd5e5eУ вас уже включена двухфакторная аутентификация."
  not-enabled: "{prefix}&#fd5e5eУ вас не включена двухфакторная аутентификация."

admin:
  no-permission: "{prefix}&#fd5e5eУ вас нет прав для этого."
  reloaded: "{prefix}&#91f251Конфигурация перезагружена."
  unregistered: "{prefix}&#91f251Аккаунт игрока &#fd8ddb{player} &#91f251удалён."
  force-logged-in: "{prefix}&#fd8ddb{player} &#91f251принудительно авторизован."
  player-not-found: "{prefix}&#fd5e5eИгрок не найден."
  migration-started: "{prefix}&#fdba5eИмпорт аккаунтов из &#fd8ddb{plugin}&#fdba5e..."
  migration-done: "{prefix}&#91f251Импорт завершён: &#fd8ddb{count} &#91f251аккаунтов импортировано."
  migration-failed: "{prefix}&#fd5e5eОшибка импорта: &#fd8ddb{error}"
  info: "{prefix}&#d4d9d8{player} -> премиум: &#fd8ddb{premium}&#d4d9d8, 2FA: &#fd8ddb{totp}&#d4d9d8, последний вход: &#5e9dfd{last-login}"
  help: "{prefix}&#d4d9d8Команды: &#e39fff{commands}"
  unknown-subcommand: "{prefix}&#fd5e5eНеизвестная подкоманда: &#fd8ddb{sub}"
  usage-unregister: "{prefix}&#fd5e5eИспользование: &#e39fff/rlogin unregister <player>"
  usage-info: "{prefix}&#fd5e5eИспользование: &#e39fff/rlogin info <player>"
  usage-forcelogin: "{prefix}&#fd5e5eИспользование: &#e39fff/rlogin forcelogin <player>"
  usage-migrate: "{prefix}&#fd5e5eИспользование: &#e39fff/rlogin migrate <authme|nlogin|jpremium> <path-or-jdbc-url>"
  unknown-importer: "{prefix}&#fd5e5eНеизвестный импортёр: &#fd8ddb{importer}"
  lang-hint: "{prefix}&#fdba5eИзмените &#fd8ddbgeneral.language&#fdba5e в config.yml и выполните &#e39fff/rlogin reload&#fdba5e."
  changeuuid-usage: "{prefix}&#fd5e5eИспользование: &#e39fff/rlogin changeuuid <from-name|from-uuid> <to-name|to-uuid>"
  changeuuid-scope: "{prefix}&#fdba5eПереносит только пароль, 2FA и дату регистрации. Инвентарь, права и экономика остаются: они принадлежат миру и другим плагинам."
  changeuuid-resolved: "{prefix}&#d4d9d8{input} -> &#fd8ddb{uuid}"
  changeuuid-success: "{prefix}&#91f251Аккаунт перенесён. Если игрок в сети, ему нужно перезайти."
  changeuuid-not-found: "{prefix}&#fd5e5eАккаунт rLogin не найден для &#fd8ddb{input}&#fd5e5e."
  changeuuid-target-exists: "{prefix}&#fd5e5eУ цели уже есть аккаунт rLogin. Сначала удалите его командой &#e39fff/rlogin unregister&#fd5e5e."
  changeuuid-same: "{prefix}&#fdba5eИсточник и цель — один и тот же UUID; делать нечего."
  changeuuid-failed: "{prefix}&#fd5e5echangeuuid не удался: &#fd8ddb{error}"

setup:
  # Shown on the connection screen when the server is missing PacketEvents.
  # {link} is replaced with a clickable download link.
  packetevents-missing: "&#fd5e5e&lСервер настроен неправильно\n\n&#d4d9d8На этом сервере не хватает нужного плагина, поэтому никто не может зайти.\n&#fdba5eСкажите администратору установить PacketEvents:\n&#e39fff{link}"
  online-mode-conflict: "&#fd5e5e&lСервер настроен неправильно\n\n&#d4d9d8На этом сервере включён online-mode, поэтому игроки без аккаунта Minecraft вообще не могут зайти.\n&#fdba5eСкажите администратору установить online-mode в false."


spawn:
  header: "{prefix}&#d4d9d8Спавны rLogin:"
  entry: "&#d4d9d8  {role} - &#fd8ddb{location}"
  not-set: "не задан (игроки остаются там, где вышли)"
  roles-help: "&#fdba5ejoin&#d4d9d8 = вход уже подтверждён  &#fdba5efirstjoin&#d4d9d8 = самый первый вход  &#fdba5elogin&#d4d9d8 = после /login  &#fdba5eregister&#d4d9d8 = после /register"
  usage: "{prefix}&#fd5e5eИспользование: &#e39fff/rlogin spawn <set|remove|teleport> <{roles}>&#fd5e5e / &#e39fff/rlogin spawn list"
  unknown-role: "{prefix}&#fd5e5eНеизвестный момент: &#fd8ddb{role}&#fd5e5e. Используйте один из: &#fd8ddb{roles}"
  set: "{prefix}&#91f251Спавн для &#fd8ddb{role}&#91f251 сохранён там, где вы стоите: &#fd8ddb{location}"
  removed: "{prefix}&#91f251Спавн для &#fd8ddb{role}&#91f251 удалён. Теперь игроки остаются там, где вышли."
  not-removed: "{prefix}&#fdba5e{role}&#fdba5e: спавн не был задан."
  teleported: "{prefix}&#91f251Телепортация на спавн &#fd8ddb{role}&#91f251: &#fd8ddb{location}"
  teleport-not-set: "{prefix}&#fd5e5e{role}&#fd5e5e: спавн не задан."
  teleport-world-missing: "{prefix}&#fd5e5e{role}&#fd5e5e указывает на мир &#fd8ddb{world}&#fd5e5e, который не загружен. Игроки остались бы на месте."

recovery:
  usage: "{prefix}&#fd5e5eИспользование: /recover <код> <новый пароль>"
  disabled: "{prefix}&#fdba5eВосстановление аккаунта на этом сервере отключено."
  already-logged-in: "{prefix}&#fdba5eВы уже вошли. Используйте /changepassword."
  no-codes: "{prefix}&#fd5e5eУ этого аккаунта не осталось кодов восстановления. Обратитесь к администратору."
  wrong-code: "{prefix}&#fd5e5eЭтот код восстановления недействителен."
  success: "{prefix}&#91f251Аккаунт восстановлен. Пароль изменён, 2FA отключена. Осталось кодов: &#fd8ddb{remaining}&#91f251."
  none-left: "{prefix}&#fdba5eЭто был последний код. Попросите у администратора новый набор."
  issued-header: "{prefix}&#fdba5eКоды восстановления - запишите их сейчас:"
  issued-entry: "&#fd8ddb  {code}"
  issued-footer: "{prefix}&#d4d9d8Больше они не будут показаны. Каждый работает один раз и позволяет задать новый пароль."
