# ============================================================
#  rLogin (Velocity) — proxy configuration
#  https://github.com/pyrelightmc/rlogin
#
#  This file is short on purpose. rLogin is configured on the BACKEND, in
#  plugins/rLogin/config.yml there: passwords, 2FA, sessions, spawns,
#  languages, UUID handling, messages. None of it belongs on a proxy.
#
#  The proxy is a connector. It does two things:
#    - Verifies premium accounts with Mojang, because behind a proxy it is
#      the only place that can. Always on; there is nothing to configure.
#    - Makes sure a player logs in once, on a server that can ask, and is
#      never asked again while switching servers.
#
#  DATABASE: not here. Accounts live on the backends. If you run more than
#  one backend, point them all at the same MySQL/MariaDB so an account made
#  on one is known on the others. The proxy never reads or writes it.
# ============================================================

general:
  # Who this network is for. Must match what your backends have in their own
  # config.yml -- the proxy and the backends have to agree on who gets in.
  #
  #   auto     Premium accounts join without typing anything, everyone else with
  #            a password. Requires online-mode = false in velocity.toml, so the
  #            proxy can decide per player instead of turning non-premium away.
  #   online   Premium accounts only. Here online-mode = true in velocity.toml is
  #            the right setup: let Velocity do the verifying.
  #   offline  Passwords only. Nothing is checked against Mojang. Also requires
  #            online-mode = false.
  #
  # With auto or offline and online-mode = true, rLogin refuses every connection
  # and says so: Velocity would already have rejected the players this network
  # exists for, before rLogin ever saw them.
  auth-mode: auto

login-servers:
  # Servers running rLogin, i.e. the ones that can ask a player to log in.
  # Players who haven't logged in yet are sent to one of these, picked at
  # random when there is more than one.
  servers:
    - 'auth'

  # Send them there even if Velocity's own "try" order chose somewhere else.
  # Turning this off means a player can reach a server before logging in, so
  # only do it if you route the first server yourself.
  enforce: true

after-login:
  # What happens once a backend reports the player has logged in:
  #
  #   stay      Leave them where they are. Right for networks that log
  #             players in on the lobby they were going to anyway.
  #   send      Move them to one of the servers listed below, at random.
  #             Right for a dedicated auth server they should not linger on.
  #   previous  Back to the server they were on last time. Falls back to
  #             "send" if that server is gone or they have no history yet.
  action: stay

  # Used by "send", and as the fallback for "previous".
  servers:
    - 'lobby'

  # Servers "previous" should never send anyone back to. Your login servers
  # are already excluded; list anything else that makes no sense to return
  # to, like a queue or a limbo server.
  never-return-to: []

timing:
  # Wait this long (milliseconds) before moving a player between servers.
  # A short pause avoids switching mid-handshake, which drops the player.
  switch-delay: 500

  # If a switch fails, wait this long (milliseconds) and try once more.
  # Covers a backend that was briefly starting up or full.
  retry-delay: 5000

sync:
  # Shared secret between this proxy and its backends. It signs the
  # rlogin:sync messages that tell a backend "this player already
  # authenticated", so nobody can forge them.
  #
  # MUST be identical in this file AND in every backend's config.yml.
  #
  # While it is empty, the proxy and the backends do not trust each other's
  # messages: nobody gets the "skip login on server switch" shortcut, and a
  # forged message can never authenticate anyone. Every player is simply
  # asked to log in again on each backend, which is the safe state.
  #
  # Generate one with: openssl rand -base64 32   (or any long random string)
  secret: ""

metrics:
  # Anonymous statistics via bStats (https://bstats.org): proxy count, Java
  # version, and which auth-mode and routing this network uses. No player
  # data, no IPs, no account information.
  bstats: true
