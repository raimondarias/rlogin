# ============================================================
#  rLogin (Paper/Folia) — configuration
#  https://github.com/raimondarias/rlogin
# ============================================================

general:
  # Primary language is English. Spanish is bundled too (and more
  # translations may be added over time) — set the language code that
  # matches one of the messages_<code>.yml files copied next to this one.
  language: en
  debug: false

database:
  # sqlite -> zero configuration, great for a single server.
  # mysql  -> recommended if several Paper/Folia backends must share the
  #           same accounts.
  type: sqlite
  sqlite:
    file: rlogin.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: rlogin
    username: root
    password: ""
    use-ssl: false
    pool-size: 10

premium:
  # Auto-login for premium (Java-original) accounts. Behind Velocity this
  # is decided there via Modern Forwarding; standalone, it falls back to
  # the Mojang API.
  auto-login: true
  api-timeout-ms: 3000
  # What to do if the Mojang API doesn't respond in time or is down:
  #   fail-open   -> treat as cracked, ask for /login (recommended)
  #   fail-closed -> reject the connection until the API is back
  api-failure-policy: fail-open
  cache-ttl-minutes: 60
  # Disallows /register on a name that belongs to a real premium account,
  # so its legitimate owner never loses the ability to auto-login with it.
  protect-premium-names: true
  # EXPERIMENTAL. Lets premium accounts auto-login AND cracked accounts use
  # /login-/register on the SAME standalone backend (online-mode: false, no
  # Velocity in front) — like nLogin Premium's standalone mode. Requires the
  # separate PacketEvents plugin (https://modrinth.com/plugin/packetevents,
  # not bundled) to already be installed; without it this does nothing, no
  # error, no crash. If you run (or can run) Velocity in front of your
  # backend(s) instead, that path is more mature and is the recommended
  # default — see the README's "How premium auto-login works" section.
  standalone-hybrid-mode: false
  # Which UUID a player ends up with. Only applies to a standalone server
  # (online-mode: false, no proxy) — behind Velocity the identity is already
  # decided before rLogin sees the connection.
  #
  #   real     Verified premium players join with their REAL Mojang UUID;
  #            everyone else keeps the offline one. The only mode where
  #            "premium Steve" and "cracked Steve" are separate accounts,
  #            and where your other plugins (permissions, economy, bans) see
  #            the same UUID they'd see on any online-mode server.
  #   cracked  Everyone gets the offline UUID derived from their name,
  #            premium included. Auto-login still works. Use this to keep an
  #            existing offline-mode world/database working untouched.
  #            ("offline" is accepted as a synonym.)
  #   random   A random UUID generated the first time each name connects and
  #            reused from then on, for premium and cracked alike. Lets a
  #            player move between premium and cracked without losing data.
  uuid-type: real

session:
  # "Remember me": if the player reconnects from the same IP within this
  # window, they won't be asked to /login again.
  remember-me: true
  remember-me-minutes: 30

security:
  bruteforce:
    enabled: true
    max-attempts: 5
    lockout-seconds: 60
    lockout-multiplier: 2.0
    max-lockout-seconds: 3600
  totp:
    enabled: true
    issuer: rLogin
  password:
    min-length: 5
    max-length: 30
    bcrypt-cost: 10

limbo:
  # While not authenticated: the player is frozen in place (no teleport to
  # a separate limbo world) and can only use the commands in this list.
  freeze: true
  allowed-commands:
    - /login
    - /l
    - /register
    - /reg
    - /2fa
  reminder-interval-seconds: 5

bedrock:
  # Players connecting via Geyser/Floodgate are treated as premium auto-login.
  floodgate-auto-login: true
  prefix: "."

update-checker:
  enabled: true

metrics:
  bstats: true
