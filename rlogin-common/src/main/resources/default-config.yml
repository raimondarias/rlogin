# ============================================================
#  rLogin (Paper/Folia) — configuration
#  https://github.com/pyrelightmc/rlogin
#
#  You do not need to change anything here. The defaults are the
#  recommended setup, and premium auto-login turns itself on when your
#  server needs it — there is no switch to find and forget.
#
#  ONE THING TO GET RIGHT: online-mode in server.properties must be
#  FALSE, unless you set auth-mode: online below. With it on, this
#  server turns away every player without a Minecraft account before
#  rLogin is even consulted — so the players auth-mode: auto exists for
#  can never arrive. rLogin refuses every connection when the two
#  disagree, rather than look healthy while serving nobody.
#
#  On a single server with online-mode: false and no proxy, rLogin
#  verifies premium accounts against Mojang itself, and that REQUIRES
#  the free PacketEvents plugin:
#      https://modrinth.com/plugin/packetevents
#  Behind a proxy, or with auth-mode: online, it is not needed — the
#  proxy or the server already did the verifying.
# ============================================================

general:
  # Who is allowed on this server. The one decision worth making consciously;
  # everything below has a sensible default.
  #
  #   auto     Both kinds of player. Premium accounts are verified and join
  #            without typing anything; everyone else registers and logs in
  #            with a password. What most servers want.
  #   online   Premium accounts only. Anyone Mojang doesn't vouch for is
  #            refused, and /register serves no purpose. The one mode where
  #            online-mode: true is the right setting: let the server do the
  #            verifying instead of rLogin.
  #   offline  Passwords only. Nothing is checked against Mojang, so a premium
  #            player registers like everybody else. This is the only mode
  #            that does NOT need PacketEvents on a standalone server.
  auth-mode: auto
  # Any of the 17 languages in the messages/ folder next to this file:
  # en, es, pt_BR, de, fr, ru, zh_CN, pl, it, nl, tr, uk, ja, ko, ar, vi, id
  # To add your own, drop a lang_<code>.yml in that folder and name it here.
  language: en
  # Explains in the console why each connection was let in, asked for a
  # password, or refused. Off by default because it's one line per login;
  # turn it on when something isn't behaving and you want to know why.
  debug: false

database:
  # sqlite -> zero configuration, the right choice for a single server.
  # mysql  -> only needed if several servers must share the same accounts.
  type: sqlite
  sqlite:
    file: rlogin.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: rlogin
    username: root
    password: ""
    use-ssl: false
    pool-size: 10

premium:
  # Premium (Java-original) accounts join without typing anything.
  auto-login: true
  # How long to wait for Mojang before giving up on one lookup.
  api-timeout-ms: 3000
  # What to do when Mojang doesn't answer in time or is down:
  #   fail-open   -> treat the player as cracked and ask for /login (recommended)
  #   fail-closed -> refuse the connection until Mojang is reachable again
  api-failure-policy: fail-open
  # How long a name's premium/cracked status is remembered, so Mojang isn't
  # asked again on every single connection.
  cache-ttl-minutes: 60
  # Refuses /register on a name that belongs to a real premium account, so
  # its owner never loses the ability to auto-login with it. Turn this off
  # only if you deliberately want cracked players to claim premium names.
  protect-premium-names: true

  # Which UUID a player ends up with. Only applies to a standalone server
  # (online-mode: false, no proxy) — behind Velocity the identity is already
  # decided before rLogin ever sees the connection.
  #
  #   real     Verified premium players join with their REAL Mojang UUID;
  #            everyone else keeps the offline one. The only mode where
  #            "premium Steve" and "cracked Steve" are separate accounts,
  #            and where your other plugins (permissions, economy, bans) see
  #            the same UUID they would on any online-mode server.
  #   cracked  Everyone gets the offline UUID derived from their name,
  #            premium included. Auto-login still works. Use this to keep an
  #            existing offline-mode world and database working untouched.
  #            ("offline" is accepted as a synonym.)
  #   random   A random UUID generated the first time each name connects and
  #            reused from then on, for premium and cracked alike. Lets a
  #            player move between premium and cracked without losing data.
  #
  # Changing this on a server that already has players changes who they are:
  # they will look like brand-new players to every other plugin. Use
  # /rlogin changeuuid to carry an account across if you do.
  uuid-type: real

session:
  # "Remember me": a player who already logged in and reconnects from the
  # same IP within this window isn't asked for their password again.
  #
  # Worth knowing before you raise the window: this trusts an ADDRESS, and
  # addresses are shared. Everyone behind the same router or mobile carrier
  # looks identical, and on a cracked server the UUID comes from the name,
  # so a neighbour typing your name inherits your session until it expires.
  # Accounts with 2FA are never given this shortcut, and changing a password
  # cancels it immediately. Set remember-me: false to switch it off entirely.
  remember-me: true
  remember-me-minutes: 30

security:
  # Slows down password guessing. After too many wrong passwords the
  # ADDRESS is locked out for a while, and each further failure locks it for
  # longer. The account itself is never locked: that would let anyone who
  # knows a name keep its owner out just by failing logins on purpose.
  bruteforce:
    enabled: true
    max-attempts: 5
    lockout-seconds: 60
    # Each additional failure multiplies the lockout by this, up to the max.
    lockout-multiplier: 2.0
    max-lockout-seconds: 3600
  # Optional second factor via any authenticator app (Google Authenticator,
  # Aegis, 1Password...). Players opt in themselves with /2fa enable.
  totp:
    enabled: true
    # The name players see for this server inside their authenticator app.
    issuer: rLogin
  password:
    min-length: 5
    max-length: 30
    # How slow password hashing is, which is what makes stolen hashes hard
    # to crack. Each +1 doubles the time. 10 is a good balance; going much
    # higher will make logins noticeably slow on a weak CPU.
    bcrypt-cost: 10

limbo:
  # Until they log in, players are frozen where they are (no separate limbo
  # world) and can only run the commands listed here.
  freeze: true
  allowed-commands:
    - /login
    - /l
    - /register
    - /reg
    - /2fa
  # How often to remind them to log in, in seconds.
  reminder-interval-seconds: 5
  # Kick a player who never logs in, after this many seconds. A connection
  # parked forever at the login prompt still holds a player slot, which is all
  # it takes to fill a server without owning a single account. 0 disables it.
  login-timeout-seconds: 60

bedrock:
  # Bedrock players arriving through Geyser/Floodgate are already verified
  # by Microsoft, so they're treated like premium and never asked to log in.
  floodgate-auto-login: true
  # Must match the "username-prefix" in Floodgate's own config.
  prefix: "."

update-checker:
  # Checks GitHub once at startup and prints a line if a newer release
  # exists. Nothing is sent about your server, and nothing is downloaded.
  enabled: true

metrics:
  # Anonymous statistics via bStats (https://bstats.org): server count,
  # Minecraft and Java version, and which of rLogin's modes are in use.
  # No player data, no IPs, no account information.
  bstats: true
